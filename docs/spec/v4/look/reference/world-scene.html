<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;image-rendering:pixelated}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
const raw = new URLSearchParams(location.search).get('style') || 'ps1';
const night = raw==='night';
const style = (raw==='mixv'||night) ? 'vapor' : raw;
const W = 1200, H = 800;
const renderer = new THREE.WebGLRenderer({antialias: style==='wire', preserveDrawingBuffer:true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const P = {
  ps1:  {lowres: 300, dither: true, levels: 6, bloom: 0.0, scan: 0.0, ca: 0.0},
  vapor:{lowres: 0,   dither: false, levels: 0, bloom: 0.35, scan: 0.08, ca: 0.0015},
  wire: {lowres: 0,   dither: false, levels: 0, bloom: 1.1, scan: 0.12, ca: 0.003},
  night:{lowres: 420, dither: true, levels: 14, bloom: 0.35, scan: 0.08, ca: 0.0015},
  mixv: {lowres: 420, dither: true, levels: 14, bloom: 0.4, scan: 0.08, ca: 0.0015},
  mix:  {lowres: 300, dither: true, levels: 7, bloom: 0.25, scan: 0.06, ca: 0.0},
}[raw];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, W/H, 0.1, 200);
camera.position.set(9, 6.5, 11); camera.lookAt(0, 1.1, 0);

// palettes
const vaporPal = {ground:0x7fe3d8, side:0xff8fd0, hut:0xffc8e8, roof:0x9b7bff, cat:0x5ad1ff, catDark:0x2b4bff, tree:0xff71ce, trunk:0xb967ff, tower:0x01cdfe};
const ps1Pal = {ground:0x6aa84f, side:0x8a5a3c, hut:0xd9c4a0, roof:0xb0413e, cat:0xe8a24a, catDark:0x8a4f1e, tree:0x3f7d3a, trunk:0x6b4226, tower:0x9aa7b0};
const pal = (style==='vapor'||style==='mix'||style==='mixv') ? vaporPal : ps1Pal;

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;return t;}

// sky
if (style==='wire') {
  scene.background = new THREE.Color(0x02030a);
} else if (style==='ps1') {
  scene.background = canvasTex(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#1d2b64');gr.addColorStop(0.55,'#f8a35a');gr.addColorStop(1,'#f8cdda');g.fillStyle=gr;g.fillRect(0,0,w,h);});
  scene.fog = new THREE.Fog(0xf3b07a, 18, 40);
} else {
  scene.background = canvasTex(512,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2b0b5e');gr.addColorStop(0.45,'#ff3fa4');gr.addColorStop(0.7,'#ffb36b');gr.addColorStop(1,'#2b0b5e');g.fillStyle=gr;g.fillRect(0,0,w,h);
    // striped sun
    const cx=w*0.5, cy=h*0.52, r=w*0.2; const sg=g.createLinearGradient(0,cy-r,0,cy+r);sg.addColorStop(0,'#fff27a');sg.addColorStop(1,'#ff4f9a');g.fillStyle=sg;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill();
    g.fillStyle=gr; for(let i=0;i<7;i++){const y=cy+i*r*0.17;g.fillRect(cx-r,y,2*r,3+i*1.6);} });
  scene.fog = new THREE.Fog(0x8a2be2, 20, 45);
}

const wireMode = style==='wire';
const group = new THREE.Group(); scene.add(group);
const wireCol = [0x00fff0, 0xff2bd6, 0x7cff4f, 0xffe84a];
let wi = 0;
function mat(color, opts={}) {
  if (style==='vapor') return new THREE.MeshPhongMaterial({color, shininess: 80, specular: 0xffffff, flatShading: true, ...opts});
  return new THREE.MeshLambertMaterial({color, flatShading: true, ...opts});
}
function add(geo, color, pos, rot=[0,0,0], {wire=false, wcol=null}={}) {
  if (wireMode || wire) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), new THREE.LineBasicMaterial({color: wcol ?? wireCol[(wi++)%wireCol.length]}));
    e.position.set(...pos); e.rotation.set(...rot); group.add(e);
    if (wireMode) { // faint fill so shapes read
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0x050818, transparent:true, opacity:0.85}));
      m.position.copy(e.position); m.rotation.copy(e.rotation); m.scale.setScalar(0.995); group.add(m);
    }
    return e;
  }
  const m = new THREE.Mesh(geo, mat(color)); m.position.set(...pos); m.rotation.set(...rot); group.add(m); return m;
}

// lights
scene.add(new THREE.HemisphereLight(style==='ps1'?0xffe2c0:0xffc0f0, style==='ps1'?0x3a2a50:0x301060, 1.6));
const sun = new THREE.DirectionalLight(style==='ps1'?0xffb070:0xffffff, 2.2); sun.position.set(-6, 10, 4); scene.add(sun);

// island
add(new THREE.CylinderGeometry(6, 6, 0.6, 10), pal.ground, [0,-0.3,0]);
add(new THREE.CylinderGeometry(6, 2.5, 3, 10), pal.side, [0,-2.1,0]);

// floor grid (vapor/mix)
if (style==='vapor' || style==='mix') {
  const grid = new THREE.GridHelper(90, 60, 0xff3fd0, 0xff3fd0); grid.position.y = -5; scene.add(grid);
}
if (wireMode) { const grid = new THREE.GridHelper(90, 50, 0x113355, 0x113355); grid.position.y = -4; scene.add(grid); }

// hut / workshop
add(new THREE.BoxGeometry(3, 2.2, 2.6), pal.hut, [-2.2, 1.1, -1.8]);
add(new THREE.ConeGeometry(2.4, 1.4, 4), pal.roof, [-2.2, 2.9, -1.8], [0, Math.PI/4, 0]);
// door glow
add(new THREE.BoxGeometry(0.8, 1.3, 0.05), 0x2a1a10, [-1.6, 0.65, -0.48]);

// monitor on desk showing Merge's screen
const screenTex = canvasTex(160,100,(g,w,h)=>{g.fillStyle='#0a0f2a';g.fillRect(0,0,w,h);g.fillStyle='#39ff88';g.font='bold 14px monospace';g.fillText('> bread.api',8,22);g.fillText('  status: 418',8,42);g.fillStyle='#ff4fd8';g.fillText('  I AM A TOAST',8,62);g.fillStyle='#39ff88';g.fillText('> _',8,84);});
add(new THREE.BoxGeometry(1.6, 0.12, 0.9), pal.trunk, [1.6, 0.75, -2.0]);
add(new THREE.BoxGeometry(0.12, 0.75, 0.12), pal.trunk, [1.0, 0.37, -2.0]);
add(new THREE.BoxGeometry(0.12, 0.75, 0.12), pal.trunk, [2.2, 0.37, -2.0]);
add(new THREE.BoxGeometry(1.2, 0.85, 0.12), 0x222233, [1.6, 1.35, -2.25]);
if (!wireMode) { const s = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 0.7), new THREE.MeshBasicMaterial({map: screenTex})); s.position.set(1.6,1.35,-2.18); group.add(s); }
else { const s = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 0.7), new THREE.MeshBasicMaterial({map: screenTex})); s.position.set(1.6,1.35,-2.18); group.add(s); }

// tree / palm
if (style==='vapor'||style==='mix') {
  add(new THREE.CylinderGeometry(0.12, 0.2, 3.2, 6), pal.trunk, [-4.2, 1.6, 1.4], [0,0,0.15]);
  for (let i=0;i<6;i++){const a=i/6*Math.PI*2; add(new THREE.ConeGeometry(0.25, 2.2, 4), pal.tree, [-4.45+Math.cos(a)*0.8, 3.1, 1.4+Math.sin(a)*0.8], [Math.sin(a)*1.9, 0, -Math.cos(a)*1.9]);}
  // marble bust-ish column
  add(new THREE.CylinderGeometry(0.35,0.35,1.4,8), 0xf5f0ff, [3.8,0.7,1.8]);
  add(new THREE.IcosahedronGeometry(0.45,0), 0xf5f0ff, [3.8,1.75,1.8]);
} else {
  add(new THREE.CylinderGeometry(0.18, 0.25, 1.6, 6), pal.trunk, [-4.2, 0.8, 1.4]);
  add(new THREE.ConeGeometry(1.1, 2.2, 6), pal.tree, [-4.2, 2.6, 1.4]);
  add(new THREE.ConeGeometry(0.8, 1.6, 6), pal.tree, [-4.2, 3.5, 1.4]);
  add(new THREE.DodecahedronGeometry(0.5,0), 0x8d8d8d, [3.8, 0.3, 1.8]);
}

// unfinished project: a rocket/tower made of scaffold. Wireframe in mix (and wire), solid-ish in others
const unfinished = raw==='mix' || raw==='mixv' || night;
const towerOpts = unfinished ? {wire:true, wcol:0x00fff0} : {};
add(new THREE.CylinderGeometry(0.7, 0.9, 3.2, 8), pal.tower, [3.6, 1.6, -2.6], [0,0,0], towerOpts);
add(new THREE.ConeGeometry(0.7, 1.3, 8), pal.roof, [3.6, 3.85, -2.6], [0,0,0], towerOpts);
for (const a of [0, 2.1, 4.2]) add(new THREE.BoxGeometry(0.1, 1.1, 0.7), pal.roof, [3.6+Math.cos(a)*0.85, 0.55, -2.6+Math.sin(a)*0.85], [0,-a,0], towerOpts);

// floating "files" (works) above island
const fileCols=[0xff4fd8,0x39ff88,0xfff27a,0x5ad1ff];
for (let i=0;i<4;i++) add(new THREE.BoxGeometry(0.5,0.65,0.08), fileCols[i], [-1.2+i*1.2, 4.6+Math.sin(i*1.7)*0.35, 1.2], [0.2, i*0.5, 0.1]);

// Merge the cat
const cat = new THREE.Group(); cat.position.set(0.9, 0, 1.4); cat.rotation.y = 0.6; group.add(cat);
function addC(geo, color, pos, rot=[0,0,0]) { const before = group.children.length; const m = add(geo, color, pos, rot); // move to cat
  const moved = group.children.splice(before); moved.forEach(o=>cat.add(o)); return m; }
addC(new THREE.CapsuleGeometry(0.45, 0.8, 3, 8), pal.cat, [0, 0.6, 0], [0,0,Math.PI/2]);
addC(new THREE.IcosahedronGeometry(0.48, 1), pal.cat, [0.85, 1.05, 0]);
addC(new THREE.ConeGeometry(0.16, 0.35, 4), pal.catDark, [0.85, 1.55, 0.22]);
addC(new THREE.ConeGeometry(0.16, 0.35, 4), pal.catDark, [0.85, 1.55, -0.22]);
addC(new THREE.CylinderGeometry(0.07, 0.1, 1.1, 5), pal.catDark, [-0.85, 1.0, 0], [0,0,0.6]);
for (const z of [0.25,-0.25]) for (const x of [0.35,-0.35]) addC(new THREE.CylinderGeometry(0.1,0.1,0.4,5), pal.catDark, [x, 0.2, z]);
// eyes: glowing (AI)
for (const z of [0.17,-0.17]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.075, 6, 4), new THREE.MeshBasicMaterial({color: style==='ps1'?0x39ff88:0x00fff0})); e.position.set(1.28, 1.12, z); cat.add(e); }

// thought bubble sprite
const bubble = canvasTex(512,200,(g,w,h)=>{
  const dark = wireMode;
  g.fillStyle = dark ? 'rgba(0,10,30,0.9)' : '#fffdf5'; g.strokeStyle = dark ? '#00fff0' : '#1a1030'; g.lineWidth=6;
  g.beginPath(); g.roundRect(8,8,w-16,h-60,28); g.fill(); g.stroke();
  g.beginPath(); g.arc(70,h-34,14,0,7); g.fill(); g.stroke(); g.beginPath(); g.arc(40,h-14,8,0,7); g.fill(); g.stroke();
  g.fillStyle = dark ? '#00fff0' : '#1a1030'; g.font='bold 34px monospace'; g.fillText('what if bread', 34, 62); g.fillText('had an API?', 34, 108);
});
const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: bubble, depthTest:false})); sp.scale.set(3.4, 1.33, 1); sp.position.set(2.2, 3.5, 1.9); scene.add(sp);

if (night) {
  scene.background = canvasTex(1024,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#05021a');gr.addColorStop(0.5,'#2b0b5e');gr.addColorStop(0.68,'#8c1eff');gr.addColorStop(0.72,'#ff3fa4');gr.addColorStop(0.74,'#12042e');gr.addColorStop(1,'#05021a');g.fillStyle=gr;g.fillRect(0,0,w,h);
    let r=7;for(let i=0;i<260;i++){r=(r*16807)%2147483647;const x=r%w;r=(r*16807)%2147483647;const y=r%(h*0.6);g.fillStyle=i%9?'#ffffff':'#7ffcff';g.globalAlpha=0.4+(i%5)*0.15;g.fillRect(x,y,i%13?1.5:3,i%13?1.5:3);}g.globalAlpha=1;
    const cx=w*0.3,cy=h*0.3,rr=h*0.07;g.fillStyle='#d8d8ff';g.beginPath();g.arc(cx,cy,rr,0,7);g.fill();g.fillStyle='#05021a';g.beginPath();g.arc(cx+rr*0.45,cy-rr*0.2,rr*0.9,0,7);g.fill();});
  scene.fog = new THREE.Fog(0x2b0b5e, 20, 45);
  scene.traverse(o=>{ if(o.isHemisphereLight){o.intensity=0.9;o.color.set(0x8a7bff);o.groundColor.set(0x2b0b5e);} if(o.isDirectionalLight){o.intensity=0.5;o.color.set(0x9db4ff);} });
  sp.visible=false;
  const glow=(w,h,c,p)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c}));m.position.set(...p);scene.add(m);};
  glow(0.8,1.3,0xfff27a,[-1.6,0.65,-0.45]); glow(0.7,0.7,0xff9ad8,[-3.0,1.3,-0.49]);
  const pl=new THREE.PointLight(0xffc98a,8,7);pl.position.set(-1.6,1,0.6);scene.add(pl);
  const pl2=new THREE.PointLight(0x39ff88,3,5);pl2.position.set(1.6,1.4,-1.2);scene.add(pl2);
  const pl3=new THREE.PointLight(0x00fff0,5,6);pl3.position.set(3.6,2,-1.6);scene.add(pl3);
}
// --- render pipeline ---
const lowH = P.lowres || H, lowW = Math.round(lowH * W / H);
const rt = new THREE.WebGLRenderTarget(lowW, lowH, {minFilter: THREE.NearestFilter, magFilter: P.lowres?THREE.NearestFilter:THREE.LinearFilter});
renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null);

const post = new THREE.ShaderMaterial({
  uniforms: {t: {value: rt.texture}, res: {value: new THREE.Vector2(lowW, lowH)}, outRes: {value: new THREE.Vector2(W,H)},
    dither: {value: P.dither?1:0}, levels: {value: P.levels||8}, bloom: {value: P.bloom}, scan: {value: P.scan}, ca: {value: P.ca}},
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    uniform sampler2D t; uniform vec2 res, outRes; uniform float dither, levels, bloom, scan, ca; varying vec2 v;
    float bayer(vec2 p){ int x=int(mod(p.x,4.)), y=int(mod(p.y,4.)); int i=x+y*4;
      float m[16]; m[0]=0.;m[1]=8.;m[2]=2.;m[3]=10.;m[4]=12.;m[5]=4.;m[6]=14.;m[7]=6.;m[8]=3.;m[9]=11.;m[10]=1.;m[11]=9.;m[12]=15.;m[13]=7.;m[14]=13.;m[15]=5.;
      for(int k=0;k<16;k++){ if(k==i) return m[k]/16.; } return 0.; }
    void main(){
      vec2 uv=v;
      vec3 c = vec3(texture2D(t, uv+vec2(ca,0.)).r, texture2D(t, uv).g, texture2D(t, uv-vec2(ca,0.)).b);
      if (bloom>0.) { vec3 b=vec3(0.); for(int i=-4;i<=4;i++) for(int j=-4;j<=4;j++){ vec3 s=texture2D(t, uv+vec2(float(i),float(j))*2.5/res).rgb; b+=max(s-0.45,0.); } c += b/81.*bloom*3.; }
      c = pow(max(c,0.), vec3(1./2.2));
      if (dither>0.5) { vec2 px = floor(uv*res); float d = bayer(px)-0.5; c = floor(c*(levels-1.)+0.5+d)/(levels-1.); }
      if (scan>0.) { c *= 1.0 - scan*step(0.5, fract(v.y*outRes.y/3.)); }
      vec2 q=v-0.5; c *= 1.0 - dot(q,q)*0.6;
      gl_FragColor=vec4(c,1.);
    }`
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), post);
const s2 = new THREE.Scene(); s2.add(quad);
const oc = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
renderer.render(s2, oc);
window.DONE = true;
</script></body></html>
