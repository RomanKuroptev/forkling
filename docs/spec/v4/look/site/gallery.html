.m95-sunken{border:2px solid;border-color:#5a1a7a #ffffff #ffffff #5a1a7a}
.m95-ico{width:40px;height:40px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #1a0b3b)}
.m95-dim{position:absolute;inset:0;background:rgba(26,6,64,.55)}

.m95-tile{background:#ffffff;border:2px solid #1a0b3b;box-shadow:3px 3px 0 #ff3fa4;margin:0}

.m95-tile figcaption{padding:5px 8px 7px;font-size:20px;line-height:1}
.m95-tile figcaption span{display:block;color:#6a3a8a;font-size:17px;margin-bottom:2px}
.m95-blink{animation:m95b 1s steps(1) infinite}@keyframes m95b{50%{opacity:0}}
.m95-night .m95-sky{background:linear-gradient(180deg,#05021a 0%,#1a0b4a 40%,#3b1280 61.8%,#05021a 62%,#05021a 100%)}

.m95-night article,.m95-night p[style*='background: #ffffff'],.m95-night input{background:#1a0b3b!important;color:#f4e8ff!important;border-color:#7a4ad0!important}

.m95-night .m95-tile{background:#1a0b3b;color:#f4e8ff}
