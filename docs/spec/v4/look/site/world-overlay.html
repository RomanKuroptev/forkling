<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Merge 95, inside the world</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8c1eff}a:hover{color:#2b0b5e}
.m95-sky{position:absolute;inset:0;background:linear-gradient(180deg,#2b0b5e 0%,#8c1eff 28%,#ff3fa4 50%,#ffb36b 61.8%,#2b0b5e 62%,#1a0640 100%)}
.m95-sun{position:absolute;left:50%;top:62%;width:520px;height:520px;transform:translate(-50%,-62%);border-radius:50%;background:linear-gradient(#fff27a,#ff4f9a 75%);-webkit-mask:repeating-linear-gradient(180deg,#000 0 30px,transparent 30px 36px);mask:repeating-linear-gradient(180deg,#000 0 30px,transparent 30px 36px);clip-path:inset(0 0 38% 0)}
.m95-grid{position:absolute;left:-50%;right:-50%;bottom:0;height:38%;background:linear-gradient(90deg,rgba(255,63,208,.9) 2px,transparent 2px) 0 0/60px 60px,linear-gradient(rgba(255,63,208,.9) 2px,transparent 2px) 0 0/60px 60px;transform:perspective(300px) rotateX(60deg);transform-origin:top}
.m95-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.07) 2px 3px)}
.m95-win{position:absolute;background:#ffd6f1;border:2px solid;border-color:#ffffff #5a1a7a #5a1a7a #ffffff;box-shadow:4px 4px 0 rgba(26,11,59,.55)}
.m95-bar{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 8px;color:#ffffff;font-family:'Press Start 2P',monospace;font-size:11px;background:linear-gradient(90deg,#8c1eff,#ff3fa4 60%,#01cdfe)}
.m95-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 1px 0 #3a0a5e}
.m95-tb{width:20px;height:18px;padding:0;background:#ffd6f1;border:2px solid;border-color:#ffffff #5a1a7a #5a1a7a #ffffff;color:#1a0b3b;font-family:'Press Start 2P',monospace;font-size:9px;line-height:1;cursor:pointer}
.m95-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;font-family:'Press Start 2P',monospace;font-size:11px;padding:10px 14px;background:#ffd6f1;color:#1a0b3b;border:2px solid;border-color:#ffffff #5a1a7a #5a1a7a #ffffff;box-shadow:2px 2px 0 #1a0b3b;cursor:pointer;text-decoration:none}
.m95-btn:hover{color:#1a0b3b;filter:brightness(1.05)}
.m95-sunken{border:2px solid;border-color:#5a1a7a #ffffff #ffffff #5a1a7a}
.m95-ico{width:40px;height:40px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #1a0b3b)}
.m95-dim{position:absolute;inset:0;background:rgba(26,6,64,.55)}
.m95-tab{font-family:'Press Start 2P',monospace;font-size:10px;padding:8px 10px;background:#ffd6f1;border:2px solid;border-color:#ffffff #5a1a7a #ffd6f1 #ffffff;color:#1a0b3b}
.m95-tab[aria-selected=true]{background:#ffffff;position:relative;top:2px}
.m95-tile{background:#ffffff;border:2px solid #1a0b3b;box-shadow:3px 3px 0 #ff3fa4;margin:0}
.m95-tile>div{height:120px;border-bottom:2px solid #1a0b3b;overflow:hidden}
.m95-tile figcaption{padding:5px 8px 7px;font-size:20px;line-height:1}
.m95-tile figcaption span{display:block;color:#6a3a8a;font-size:17px;margin-bottom:2px}
.m95-blink{animation:m95b 1s steps(1) infinite}@keyframes m95b{50%{opacity:0}}
.m95-night .m95-sky{background:linear-gradient(180deg,#05021a 0%,#1a0b4a 40%,#3b1280 61.8%,#05021a 62%,#05021a 100%)}
.m95-night .m95-sun{background:linear-gradient(#e9e4ff,#8f5bff 80%);width:360px;height:360px}
.m95-night .m95-grid{background:linear-gradient(90deg,rgba(1,205,254,.85) 2px,transparent 2px) 0 0/60px 60px,linear-gradient(rgba(1,205,254,.85) 2px,transparent 2px) 0 0/60px 60px}
.m95-night .m95-win{background:#2a1257;border-color:#7a4ad0 #0d0424 #0d0424 #7a4ad0;color:#f4e8ff}
.m95-night .m95-bar{background:linear-gradient(90deg,#3b1280,#8c1eff 60%,#01cdfe)}
.m95-night .m95-tb,.m95-night .m95-btn{background:#3a1a70;color:#f4e8ff;border-color:#7a4ad0 #0d0424 #0d0424 #7a4ad0}
.m95-night article,.m95-night p[style*='background: #ffffff'],.m95-night input{background:#1a0b3b!important;color:#f4e8ff!important;border-color:#7a4ad0!important}
.m95-night p[style*='background: #e3fffb']{background:#0f3340!important;color:#e3fffb!important}
.m95-night article span,.m95-night strong{color:#ff9be6!important}
.m95-night footer{background:#2a1257!important;border-top-color:#7a4ad0!important;color:#f4e8ff}
.m95-night footer .m95-sunken{background:#1a0b3b!important;color:#f4e8ff}
.m95-night .m95-tile{background:#1a0b3b;color:#f4e8ff}
</style>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'VT323', monospace; color: #1a0b3b"><img src="../world.png" alt="First person view of Merge's island at sunset" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"><div style="position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 8px; align-items: center; z-index: 3"><a class="m95-btn" href="#">◀ desktop</a><span class="m95-sunken" style="background: #ffd6f1; padding: 6px 10px; font-size: 20px">WORLD.exe — Merge's island · 3 places</span><a class="m95-btn" href="#" style="margin-left: auto" aria-label="Help">?</a></div><div class="m95-win" style="left: 570px; top: 240px; width: 400px; z-index: 3"><div class="m95-bar" style="font-size: 9px"><span>merge.exe thinks</span><button class="m95-tb" aria-label="Close">×</button></div><p style="margin: 0; padding: 6px 8px; font-size: 26px; line-height: 1.05">is a toaster a computer if it has an API?</p></div><svg width="24" height="36" viewBox="0 0 12 18" shape-rendering="crispEdges" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; filter: drop-shadow(2px 2px 0 #1a0b3b)"><path d="M0 0 L0 15 L4 11 L7 17 L9 16 L6 10 L11 10 Z" fill="#ffffff" stroke="#1a0b3b" stroke-width="1"/></svg><div style="position: absolute; left: 50%; top: calc(50% + 46px); transform: translateX(-50%); background: #1a0b3b; color: #ffffff; padding: 4px 10px; font-size: 22px; z-index: 3">click to say hi to Merge</div><div class="m95-win" style="left: 1120px; top: 560px; width: 270px; z-index: 3"><div class="m95-bar" style="font-size: 9px"><span>toaster_lab.wip</span></div><p style="margin: 0; padding: 6px 8px; font-size: 20px; line-height: 1">being built · day 3<br>drawn in cyan lines until it's finished</p></div><p style="position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; color: #ffffff; font-size: 22px; text-shadow: 1px 1px 0 #1a0b3b; z-index: 3">WASD to walk · mouse to look · Esc for the cursor back</p><div class="m95-scan" aria-hidden="true"></div></div>


</body>
</html>
