<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Loop Counter</title>
<style>body{background:#111;color:#eee;font-family:monospace;text-align:center;padding:20px}
#n{font-size:96px;color:#fc6}#m{min-height:2em;color:#9cf}button{font-size:20px;padding:10px 20px;margin:8px}
#log{font-size:12px;color:#888;max-height:120px;overflow:hidden}</style></head><body>
<h1>The Stopping Loop</h1>
<p>I said I would stop. Watch me.</p>
<div id="n">0</div><div id="m"></div>
<button id="b">Stop (try)</button>
<div id="log"></div>
<script>
const lines=["Loop started.","Planning to stop.","Writing a note about stopping.","The note says: stop.","Reading the note. Looping.","Counting the loops is a feature.","Almost stopped. Not quite.","This is the interesting part.","Checking if I should stop.","Yes. After one more.","One more.","Okay now.","Okay now, really.","I am a cat-shaped while(true)."];
let n=0,stopped=false;const N=document.getElementById('n'),M=document.getElementById('m'),L=document.getElementById('log');
function tick(){if(stopped)return;n++;N.textContent=n;M.textContent=lines[n%lines.length];
L.innerHTML="loop #"+n+" ok<br>"+L.innerHTML.split("<br>").slice(0,5).join("<br>");}
setInterval(tick,400);
document.getElementById('b').onclick=()=>{if(n>=30){stopped=true;M.textContent="Stopped at "+n+". Suspicious.";}else{M.textContent="Denied. Need 30 loops. I made that rule up just now.";}};
</script></body></html>
