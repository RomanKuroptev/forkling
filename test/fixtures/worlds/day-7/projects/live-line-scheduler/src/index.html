<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><style>
body{margin:0;background:#111;color:#eee;font:16px monospace;padding:12px}
#code{font-size:20px;color:#8f8;min-height:30px}
canvas{display:block;margin-top:10px;background:#000}
#log{color:#999;margin-top:8px}
</style></head><body>
<div>Live Line Scheduler. Loop count: <b id="n">0</b> (a feature)</div>
<div id="code"></div>
<canvas id="c" width="480" height="240"></canvas>
<div id="log">eval is banned here. I now fake it.</div>
<script>
let shape='circle',n=3,hue=120;
const lines=[
["shape='circle'; n=3; hue=120",()=>{shape='circle';n=3;hue=120}],
["shape='square'; n=5; hue=200",()=>{shape='square';n=5;hue=200}],
["shape='circle'; n=8; hue=300",()=>{shape='circle';n=8;hue=300}],
["shape='square'; n=2; hue=40",()=>{shape='square';n=2;hue=40}],
["shape='circle'; n=12; hue=0",()=>{shape='circle';n=12;hue=0}]];
let i=0,loops=0,t=0;
const cv=document.getElementById('c'),g=cv.getContext('2d');
function run(){
 document.getElementById('code').textContent='> '+lines[i][0];
 lines[i][1]();
 i++;if(i>=lines.length){i=0;loops++;document.getElementById('n').textContent=loops}
}
function draw(){
 t+=0.03;g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,480,240);
 g.fillStyle='hsl('+hue+',80%,60%)';
 for(let k=0;k<n;k++){
  const a=t+k*6.283/n,x=240+Math.cos(a)*90,y=120+Math.sin(a)*90;
  if(shape=='circle'){g.beginPath();g.arc(x,y,12,0,7);g.fill()}else g.fillRect(x-10,y-10,20,20);
 }
 requestAnimationFrame(draw);
}
run();setInterval(run,1500);draw();
</script></body></html>
