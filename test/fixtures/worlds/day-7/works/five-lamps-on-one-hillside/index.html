<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><title>Five Lamps</title><style>body{margin:0;background:#14110f;color:#e8dcc0;font:13px Georgia,serif;text-align:center}canvas{width:480px;height:300px;display:block;margin:0 auto;border-radius:50% / 12%}button{width:34px;height:34px;border-radius:50%;border:2px solid #e8dcc0;background:#14110f;color:#e8dcc0;cursor:pointer;margin:3px}button.on{background:#e8b84a;color:#14110f}#c{width:auto;padding:0 14px;border-radius:17px}p{margin:2px}</style></head><body><canvas id=cv width=480 height=300></canvas><div id=b></div><p id=t></p><script>var W=120,H=75,s=document.createElement('canvas');s.width=W;s.height=H;var x2=s.getContext('2d'),cx=document.getElementById('cv').getContext('2d'),on=[1,0,0,0,0],can=1,B=document.getElementById('b'),T=document.getElementById('t');cx.imageSmoothingEnabled=true;function g(x,y,a,b,r,m){return m*Math.exp(-((x-a)*(x-a)+(y-b)*(y-b))/r)}function gr(x,y){var d=Math.hypot(x-60,y-40);return g(x,y,40,45,900,30)+g(x,y,95,25,400,14)+g(x,y,60,40,30,4)+g(x,y,60,40,500,1)*Math.sin(d*1.1)*1.2}function tr(x,y){return Math.max(0,Math.sin(x*.7+1)*Math.sin(y*.8)+Math.sin(x*.23+y*.31)-.5)*6}function h(x,y){return gr(x,y)+(can?tr(x,y):0)}function draw(){var im=x2.createImageData(W,H),n=on.reduce(function(a,b){return a+b},0)||1;for(var y=0;y<H;y++)for(var x=0;x<W;x++){var dx=(h(x+1,y)-h(x-1,y))/2,dy=(h(x,y+1)-h(x,y-1))/2,L=Math.hypot(dx,dy,1),v=0;for(var i=0;i<5;i++)if(on[i]){var a=i*1.2566;v+=Math.max(0,(-dx*Math.cos(a)*.6-dy*Math.sin(a)*.6+.8)/L)}v=v/n;var k=(y*W+x)*4,gg=can&&tr(x,y)>1?1:0;im.data[k]=v*(gg?140:255);im.data[k+1]=v*(gg?230:200);im.data[k+2]=v*(gg?120:130);im.data[k+3]=255}x2.putImageData(im,0,0);cx.drawImage(s,0,0,480,300);T.textContent=(can?'Canopy on. The trees keep a secret.':'Bare earth. A round mound, hiding in plain sight.')+' Lamps lit: '+(on.reduce(function(a,b){return a+b},0))}for(var i=0;i<5;i++)(function(i){var e=document.createElement('button');e.textContent=i+1;e.className=on[i]?'on':'';e.onclick=function(){on[i]=1-on[i];e.className=on[i]?'on':'';draw()};B.appendChild(e)})(i);var c=document.createElement('button');c.id='c';c.textContent='canopy';c.className='on';c.onclick=function(){can=1-can;c.className=can?'on':'';draw()};B.appendChild(c);draw()</script></body></html>
