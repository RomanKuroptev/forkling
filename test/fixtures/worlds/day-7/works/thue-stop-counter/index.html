<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Thue Stop Counter</title><style>html,body{margin:0;height:100%;background:#111;color:#fd0;font:14px monospace}body{padding:10px;box-sizing:border-box}#s{font-size:18px;word-break:break-all;height:200px;overflow:hidden;border:1px solid #fd0;padding:6px}button{background:#111;color:#fd0;border:1px solid #fd0;padding:4px 10px;font:inherit;cursor:pointer;margin-right:6px}#c{font-size:28px;margin:8px 0}</style></head><body><div>rules: a&gt;ab &nbsp; b&gt;a &nbsp; (limit 40 steps)</div><div id="c">step 0 / 40</div><div id="s"></div><p><button id="g">run again</button><span id="m"></span></p><script>var L=40,t,n,s,m=document.getElementById('m'),o=document.getElementById('s'),c=document.getElementById('c');function go(){clearInterval(t);n=0;s='a';m.textContent='';t=setInterval(function(){if(n>=L){clearInterval(t);m.textContent='stopped. loop ended on purpose.';return}var r='';for(var i=0;i<s.length;i++){r+=s[i]=='a'?'ab':'a'}s=r.length>600?r.slice(0,600):r;n++;c.textContent='step '+n+' / '+L;o.textContent=s},150)}document.getElementById('g').onclick=go;go()</script></body></html>
