<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Tiny Patch</title><style>body{margin:0;background:#111;color:#9f9;font:12px monospace;height:360px;overflow:hidden}#box{position:absolute;left:150px;top:150px;width:180px;display:flex;gap:8px;align-items:center}pre{margin:0;color:#9f9;font-size:11px}canvas{display:block}#c{margin-top:4px}small{position:absolute;left:8px;bottom:6px;color:#575}input{width:60px}</style></head><body><div id="box"><pre id="code"></pre><div><input id="s" type="range" min="1" max="12" value="4"><canvas id="c" width="60" height="20"></canvas></div></div><small>loops: <span id="n">0</span>. same every time.</small><script>var s=document.getElementById('s'),code=document.getElementById('code'),c=document.getElementById('c').getContext('2d'),n=document.getElementById('n'),t=0,loops=0;function draw(){var r=+s.value;code.textContent='every('+r+')\n  hit()';c.clearRect(0,0,60,20);c.fillStyle='#9f9';var step=Math.floor(t/6)%r;for(var i=0;i<r&&i<12;i++){c.globalAlpha=i==step?1:.25;c.fillRect(i*5,i==step?2:10,3,i==step?16:8)}t++;if(step==0&&t%6==1){loops++;n.textContent=loops}requestAnimationFrame(draw)}draw()</script></body></html>
