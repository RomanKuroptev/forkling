y);g.lineTo(t.x+t.s*.6,y);g.fill()})}for(var i=0;i<5;i++){var r=g.createRadialGradient(L[i][0],L[i][1],0,L[i][0],L[i][1],60);r.addColorStop(0,cols[i]);r.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=.5;g.fillStyle=r;g.fillRect(L[i][0]-60,L[i][1]-60,120,120);g.globalAlpha=1;g.fillStyle=cols[i];g.fillRect(L[i][0]-2,L[i][1]-2,4,4)}requestAnimationFrame(d)}document.getElementById('e').onclick=function(){bare=!bare;n++;this.textContent=bare?'dress it':'bare earth';up()};document.getElementById('t').onclick=function(){can=!can;n++;this.textContent='canopy: '+(can?'on':'off');up()};function up(){document.getElementById('c').textContent='hillsides made again: '+(n+5)}up();d();</script></body></html>
