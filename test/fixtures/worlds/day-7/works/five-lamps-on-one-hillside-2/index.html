<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><style>body{margin:0;background:#111;color:#cde;font:12px monospace}canvas{display:block}#b{position:absolute;top:4px;left:4px}button{font:12px monospace;background:#223;color:#cde;border:1px solid #567;margin-right:3px;padding:3px 6px}</style></head><body><div id=b><button id=t>canopy: on</button><button id=g>bare earth: off</button><button id=l>lamp 1</button></div><canvas id=c width=480 height=360></canvas><script>var c=document.getElementById('c'),x=c.getContext('2d'),canopy=1,bare=0,lamp=0,T=0;var N=48,h=[],tr=[];for(var i=0;i<=N;i++){h.push(200-60*Math.sin(i*.13)-30*Math.sin(i*.37+1)-i*.8);tr.push((i*7%5<2)?18+(i*13%9):0)}var A=[-60,-30,0,30,60];function draw(){x.fillStyle='#111';x.fillRect(0,0,480,360);var w=480/N;var lx=40+lamp*100;var ly=60;x.lineWidth=1;if(!bare){x.strokeStyle='#2a6';for(var i=0;i<N;i++){if(tr[i]){var X=i*w,Y=h[i];x.beginPath();x.moveTo(X,Y);x.lineTo(X,Y-tr[i]);x.moveTo(X-4,Y-tr[i]+8);x.lineTo(X,Y-tr[i]);x.lineTo(X+4,Y-tr[i]+8);x.stroke()}}}x.strokeStyle='#ca8';x.beginPath();for(var i=0;i<=N;i++){x.lineTo(i*w,h[i])}x.stroke();var a=(A[lamp]+Math.sin(T/20)*8)*Math.PI/180;var hits=0;for(var k=0;k<60;k++){var an=a+(k-30)*.012+Math.PI/2;var dx=Math.sin(an-Math.PI/2+0.0)*0,ex=lx,ey=ly,vx=Math.cos(an),vy=Math.sin(an);if(vy<=0.05)continue;var px=lx,py=ly,hit=0;for(var s=0;s<500;s+=3){px=lx+vx*s;py=ly+vy*s;if(px<0||px>480||py>360)break;var i=Math.floor(px/w),gy=h[i];if(!bare&&tr[i]&&py>gy-tr[i]&&py<gy+2){hit=1;x.strokeStyle='#4f8';break}if(py>=gy){hit=2;x.strokeStyle='#fd6';break}}if(hit){hits++;x.globalAlpha=.35;x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();x.globalAlpha=1;x.fillStyle=hit==1?'#4f8':'#fd6';x.fillRect(px-1,py-1,3,3)}}x.fillStyle='#fff';x.beginPath();x.moveTo(lx,ly-8);x.lineTo(lx+6,ly);x.lineTo(lx,ly+8);x.lineTo(lx-6,ly);x.closePath();x.fill();x.fillStyle='#cde';x.fillText('hits '+hits+(bare?' (bare ground only)':' (leaves lie)'),10,350);T++;requestAnimationFrame(draw)}t.onclick=function(){canopy=!canopy;t.textContent='canopy: '+(canopy?'on':'off');bare=!canopy;g.textContent='bare earth: '+(bare?'on':'off')};g.onclick=function(){bare=!bare;canopy=!bare;g.textContent='bare earth: '+(bare?'on':'off');t.textContent='canopy: '+(canopy?'on':'off')};l.onclick=function(){lamp=(lamp+1)%5;l.textContent='lamp '+(lamp+1)};draw()</script></body></html>
