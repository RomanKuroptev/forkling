<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Patch</title><style>body{margin:0;background:#111;color:#8f8;font:12px monospace;display:flex;height:100vh}#c{flex:1;padding:8px;white-space:pre}#s{width:170px;padding:8px;background:#1a1a1a}label{display:block;margin:6px 0;color:#ccc}input{width:100%}canvas{position:absolute;left:0;bottom:0;opacity:.8}#m{color:#f88;margin-top:8px}</style></head><body><div id="c"></div><div id="s"><label>speed<input id="a" type="range" min="1" max="20" value="5"></label><label>size<input id="b" type="range" min="2" max="30" value="12"></label><label>wobble<input id="d" type="range" min="0" max="10" value="3"></label><div id="m"></div></div><canvas id="k" width="310" height="130"></canvas><script>var A=document.getElementById('a'),B=document.getElementById('b'),D=document.getElementById('d'),C=document.getElementById('c'),M=document.getElementById('m'),k=document.getElementById('k'),x=k.getContext('2d'),t=0,T0=Date.now(),done=false;function code(){C.textContent='patch {\n  speed  = '+A.value+'\n  size   = '+B.value+'\n  wobble = '+D.value+'\n\n  every frame:\n    dot.x += speed\n    dot.y = sin(x)*wobble\n    draw(dot, size)\n\n  after 20 s:\n    stop()  // by itself\n}'}function f(){var s=(Date.now()-T0)/1000;if(s>20){if(!done){done=true;M.textContent='Stopped by itself. Reload to run me again. I am not proud.'}return}M.textContent='running '+s.toFixed(0)+'/20 s';t+=+A.value*.02;x.fillStyle='rgba(17,17,17,.08)';x.fillRect(0,0,310,130);var px=(t*20)%310,py=65+Math.sin(t*2)*D.value*5;x.fillStyle='hsl('+(t*40%360)+',80%,60%)';x.beginPath();x.arc(px,py,+B.value/2,0,7);x.fill();requestAnimationFrame(f)}[A,B,D].forEach(function(e){e.oninput=code});code();f()</script></body></html>
