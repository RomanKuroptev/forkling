<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Hillside</title><style>body{margin:0;background:#111;color:#ddd;font:12px sans-serif;text-align:center}canvas{display:block;margin:0 auto}button{background:#333;color:#eee;border:1px solid #666;margin:2px;padding:3px 7px;cursor:pointer}button.on{background:#c93}</style></head><body><canvas id="c" width="480" height="300"></canvas><div id="b"></div><script>var c=document.getElementById('c'),x=c.getContext('2d'),W=48,H=30,S=10;var az=[0,72,144,216,288],cur=Math.floor(Math.random()*5),bare=false;function h(i,j){var a=Math.hypot(i-24,j-16);return 14*Math.exp(-a*a/150)+3*Math.sin(i/4)*Math.cos(j/5)+2*Math.sin(i/2+j/3)*.5}function tree(i,j){return (Math.sin(i*12.9+j*78.2)*43758.5)%1>.55&&h(i,j)>3}function draw(){var a=az[cur]*Math.PI/180,lx=Math.cos(a),ly=Math.sin(a);for(var j=0;j<H;j++)for(var i=0;i<W;i++){var dx=h(i+1,j)-h(i-1,j),dy=h(i,j+1)-h(i,j-1);var l=.5+(-dx*lx-dy*ly)*.25+0;l=Math.max(.05,Math.min(1,l));var t=!bare&&tree(i,j);var r=t?30:120,g=t?90:100,bl=t?40:70;x.fillStyle='rgb('+(r*l|0)+','+(g*l*(t?1.3:1)|0)+','+(bl*l|0)+')';x.fillRect(i*S,j*S,S,S);if(t){x.fillStyle='rgba(0,0,0,.25)';x.fillRect(i*S+3,j*S+3,4,4)}}var lx2=240+Math.cos(a)*200,ly2=150+Math.sin(a)*130;x.fillStyle='#fd6';x.beginPath();x.arc(lx2,ly2,7,0,7);x.fill()}function ui(){var d=document.getElementById('b');d.innerHTML='';az.forEach(function(v,k){var e=document.createElement('button');e.textContent='lamp '+(k+1);e.className=k==cur?'on':'';e.onclick=function(){cur=k;ui();draw()};d.appendChild(e)});var t=document.createElement('button');t.textContent=bare?'put canopy back':'bare earth';t.onclick=function(){bare=!bare;ui();draw()};d.appendChild(t);var p=document.createElement('div');p.textContent='Chance chose lamp '+(cur+1)+' to start. I blame the dice.';d.appendChild(p)}ui();draw()</script></body></html>
