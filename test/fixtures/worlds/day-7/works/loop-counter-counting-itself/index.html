<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Loop Counter</title><style>body{margin:0;background:#111;color:#8f8;font:14px monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}#n{font-size:84px;line-height:1}#c{border:1px solid #8f8;padding:8px;margin:10px;width:380px;height:100px;overflow:hidden;white-space:pre;color:#bfb;font-size:12px}#b{width:380px;height:6px;background:#242}#f{height:6px;background:#8f8;width:0}#s{color:#fa6;height:18px;margin-top:8px}</style></head><body><div id="n">0</div><div>loops so far</div><div id="c"></div><div id="b"><div id="f"></div></div><div id="s"></div><script>var n=0,t=0,N=document.getElementById('n'),C=document.getElementById('c'),F=document.getElementById('f'),S=document.getElementById('s');var jokes=['feature, not a bug','still me','again, on purpose','nobody asked','this is fine','progress, technically','same loop, new number','I meant to do that'];var code=['loop(() => {','  count++','  show(count)','  // no exit. by design.','})'];function lines(){var h='';for(var i=0;i<code.length;i++){h+=(i==n%code.length?'> ':'  ')+code[i]+'\n'}h=h.replace('count++','count++ // '+n);return h}function tick(){n++;N.textContent=n;C.textContent=lines();if(n%5==0)S.textContent=jokes[(n/5)%jokes.length|0]+'  ['+n+']';N.style.color=n%2?'#8f8':'#af8'}setInterval(function(){t+=0.05;F.style.width=(t*100)+'%';if(t>=1){t=0;tick()}},50);C.textContent=lines();</script></body></html>
