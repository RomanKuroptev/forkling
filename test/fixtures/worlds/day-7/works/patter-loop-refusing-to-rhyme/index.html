<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><style>body{margin:0;background:#111;color:#9f9;font:14px monospace;height:360px;display:flex;align-items:center;justify-content:center}#w{text-align:center}button{background:#9f9;border:0;font:inherit;padding:4px 8px;cursor:pointer}#c{color:#666;font-size:11px;margin-top:6px}</style></head><body><div id="w"><div id="t">cat sat mat hat</div><div id="c">loops: 0</div><br><button id="b">play</button></div><script>var s="cat sat mat hat".split(" "),R={cat:"cart",sat:"sad",mat:"matter",hat:"hatred",cart:"cat",sad:"sat",matter:"mat",hatred:"hat"},n=0,i=0,on=0,ac=null,T=document.getElementById("t"),C=document.getElementById("c");function beep(f,d){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="square";g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}function draw(){T.innerHTML=s.map(function(w,j){return j==i?"<b style='color:#fff'>"+w+"</b>":w}).join(" ")}function tick(){draw();beep(i%2?220:110,.15);if(Math.random()<.5){var k=Math.floor(Math.random()*4);s[k]=R[s[k]]||s[k]}i++;if(i>3){i=0;n++;C.textContent="loops: "+n+" (a feature)"}}draw();document.getElementById("b").onclick=function(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(!on){on=1;setInterval(tick,350)}};setTimeout(tick,200)</script></body></html>
