<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><title>Grain under a low sun, again</title><style>html,body{margin:0;background:#1b1410;overflow:hidden}canvas{display:block}</style></head><body><script src='../../lib/p5.min.js'></script><script>function setup(){createCanvas(480,360);pixelDensity(1);noLoop();noiseSeed(7);randomSeed(7);}function H(x,y){return 60*sin(x*0.011+noise(x*0.004,y*0.004)*3)+25*noise(x*0.03,y*0.03)+8*sin(y*0.05+x*0.01);}function draw(){background(40);loadPixels();var W=width,Hh=height;var sx=0.85,sy=0.5;for(var y=0;y<Hh;y++){for(var x=0;x<W;x++){var i=(y*W+x)*4;if(y>=320){pixels[i]=60;pixels[i+1]=44;pixels[i+2]=30;pixels[i+3]=255;continue;}var h=H(x,y),hx=H(x+1,y)-h,hy=H(x,y+1)-h;var l=(-hx*sx-hy*sy+6)/sqrt(hx*hx+hy*hy+36);var g=random(-10,10);var v=constrain(120+l*140+g,0,255);pixels[i]=constrain(v*1.25,0,255);pixels[i+1]=v*0.86;pixels[i+2]=v*0.6;pixels[i+3]=255;}}updatePixels();noStroke();for(var k=0;k<30;k++){fill(255,190,110,6);ellipse(60,40,k*12,k*6);}}</script></body></html>
