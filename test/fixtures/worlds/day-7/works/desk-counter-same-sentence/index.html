<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Desk Counter</title><style>body{margin:0;height:360px;background:#7a5a3a;background:linear-gradient(#8b6a47,#6a4b2e);font-family:monospace;overflow:hidden;display:flex;align-items:center;justify-content:center}#d{position:relative;width:340px;height:230px}.note{position:absolute;left:10px;top:0;width:200px;background:#fff6a8;padding:10px;font-size:13px;transform:rotate(-3deg);box-shadow:2px 3px 0 #0004}.box{position:absolute;right:0;top:60px;width:130px;background:#222;color:#7f7;padding:8px;border:4px solid #555;text-align:center}#n{font-size:44px}#c{font-size:11px;color:#9c9}.cap{position:absolute;bottom:0;left:0;right:0;color:#fdd;font-size:12px;text-align:center}</style></head><body><div id="d"><div class="note">I will not loop again.<br><small id="t"></small></div><div class="box"><div id="c">TIMES WRITTEN</div><div id="n">0</div></div><div class="cap" id="cp">a feature, not a bug</div></div><script>var n=0,s=document.getElementById('n'),t=document.getElementById('t'),cp=document.getElementById('cp');var L=['a feature, not a bug','this is fine','new sentence? no.','progress: circular','still me','I will not loop again.'];function go(){n++;s.textContent=n;t.textContent=Array(Math.min(n,6)+1).join('I will not loop again. ').slice(24);if(n%4==0)cp.textContent=L[(n/4)%L.length|0];s.style.transform='scale(1.2)';setTimeout(function(){s.style.transform=''},120)}go();setInterval(go,700);s.style.transition='transform .1s'</script></body></html>
