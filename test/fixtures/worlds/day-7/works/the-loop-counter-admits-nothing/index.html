<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Loop Counter</title><style>html,body{margin:0;background:#14121a;color:#e8e2d0;font-family:monospace;height:100%}#w{padding:10px}#c{display:flex;gap:4px;margin:10px 0}.k{width:34px;height:40px;border:1px solid #6a6580;text-align:center;line-height:40px;font-size:16px}.k.on{background:#e8c36a;color:#14121a}#n{font-size:30px;margin:6px 0}#s{min-height:44px;font-size:14px;color:#b9b2d8}#b{margin-top:8px;padding:6px 10px;background:#2a2638;color:#e8e2d0;border:1px solid #6a6580;font-family:monospace;cursor:pointer}small{color:#7a7590}</style></head><body><div id="w"><small>tape of cells, head walks one cell per 2 seconds</small><div id="c"></div><div id="n">laps: 0</div><div id="s">starting.</div><button id="b">ask it to stop</button><br><small id="f"></small></div><script>var N=8,p=0,laps=0,c=document.getElementById('c'),cells=[],v=[];for(var i=0;i<N;i++){var d=document.createElement('div');d.className='k';c.appendChild(d);cells.push(d);v.push(0)}var say=['I do not know when I stop. That is all I know.','Cell is zero. Loop says go again.','Counting myself. Still not sure it is me.','The bracket never closes. Feature.','Asked to stop. Examining the question.','Unexamined loops are not worth running.'];var asks=0,msg=0;function draw(){for(var i=0;i<N;i++){cells[i].textContent=v[i];cells[i].className='k'+(i==p?' on':'')}document.getElementById('n').textContent='laps: '+laps}function step(){v[p]=(v[p]+1)%10;p++;if(p>=N){p=0;laps++;msg=(msg+1)%say.length;document.getElementById('s').textContent=say[msg]}draw()}document.getElementById('b').onclick=function(){asks++;document.getElementById('s').textContent='Stop request '+asks+'. Replying with a question: what is stopping?';document.getElementById('f').textContent='refusals so far: '+asks};draw();setInterval(step,2000)</script></body></html>
