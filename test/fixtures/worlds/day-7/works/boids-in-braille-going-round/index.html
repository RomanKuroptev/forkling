<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><style>body{margin:0;background:#101410;color:#9f9;font:12px monospace}pre{margin:0;padding:6px;font:11px/11px monospace;letter-spacing:0}#c{position:absolute;right:8px;bottom:4px;opacity:.8}</style></head><body><pre id="o"></pre><div id="c"></div><script>var W=110,H=28,PW=W*2,PH=H*4,N=70,b=[],t=0,cy=0,o=document.getElementById('o'),c=document.getElementById('c');function sc(){b=[];for(var i=0;i<N;i++){var a=Math.random()*6.28;b.push({x:Math.random()*PW,y:Math.random()*PH,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5})}}sc();var D=[[1,8],[2,16],[4,32],[64,128]];function step(g){for(var i=0;i<N;i++){var p=b[i],ax=0,ay=0,cx=0,cyy=0,vx=0,vy=0,n=0,sx=0,sy=0;for(var j=0;j<N;j++){if(i==j)continue;var q=b[j],dx=q.x-p.x,dy=q.y-p.y,d=dx*dx+dy*dy;if(d<1600){n++;cx+=q.x;cyy+=q.y;vx+=q.vx;vy+=q.vy;if(d<100){sx-=dx;sy-=dy}}}if(n){p.vx+=((cx/n-p.x)*.004+(vx/n-p.vx)*.05+sx*.03)*g;p.vy+=((cyy/n-p.y)*.004+(vy/n-p.vy)*.05+sy*.03)*g}var s=Math.hypot(p.vx,p.vy)||1;p.vx=p.vx/s*1.6;p.vy=p.vy/s*1.6;p.x=(p.x+p.vx+PW)%PW;p.y=(p.y+p.vy+PH)%PH}}function draw(){var g=[];for(var i=0;i<W*H;i++)g[i]=0;b.forEach(function(p){var x=p.x|0,y=p.y|0,cx=x>>1,cy2=y>>2,bx=x&1,by=y&3;g[cy2*W+cx]|=by<3?(bx?[8,16,32][by]:[1,2,4][by]):(bx?128:64)});var s='';for(var r=0;r<H;r++){for(var k=0;k<W;k++)s+=String.fromCharCode(10240+g[r*W+k]);s+='\n'}o.textContent=s}function f(){t++;var ph=t%900;if(ph==0){cy++;sc()}var gg=ph<450?ph/450:(900-ph)/450;if(ph>420&&ph<460)gg=1;step(gg);if(ph>800){b.forEach(function(p){p.vx+=(Math.random()-.5)*.6;p.vy+=(Math.random()-.5)*.6})}draw();c.textContent='loop #'+cy+' (a feature)';requestAnimationFrame(f)}f()</script></body></html>
