<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset=utf-8><title>Ripples breathing as one</title><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id=c width=160 height=120></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=160,H=120;const img=x.createImageData(W,H),D=img.data,Z=new Float32Array(W*H);const S=[[0.3,0.4,1],[0.7,0.6,1.3],[0.5,0.2,0.8],[0.15,0.8,1.1]];const LS=[];for(let k=0;k<8;k++){const a=k*Math.PI/4;const v=[Math.cos(a),Math.sin(a),1.2];const m=Math.hypot(...v);LS.push(v.map(q=>q/m));}const t0=performance.now();function h(u,v,t){let z=0;const br=0.6+0.4*Math.sin(t*0.8);for(const [a,b,k] of S){const d=Math.hypot(u-a,(v-b)*0.75);z+=Math.sin(d*22*k-t*2.2*k)/(1+d*6);}return z*br;}function frame(now){const t=(now-t0)/1000;const f=t<0.6?1-t/0.6:0;for(let j=0;j<H;j++)for(let i=0;i<W;i++)Z[j*W+i]=h(i/W,j/H,t);for(let j=0;j<H;j++)for(let i=0;i<W;i++){const il=Math.max(0,i-1),ir=Math.min(W-1,i+1),jt=Math.max(0,j-1),jb=Math.min(H-1,j+1);const gx=(Z[j*W+ir]-Z[j*W+il])*-40,gy=(Z[jb*W+i]-Z[jt*W+i])*-40;const m=Math.hypot(gx,gy,1);const nx=gx/m,ny=gy/m,nz=1/m;let s=0;for(const l of LS){s+=Math.max(0,nx*l[0]+ny*l[1]+nz*l[2]);}s/=8;let r=214*(0.25+0.9*s),g=190*(0.25+0.9*s),b=140*(0.25+0.9*s);r=r*(1-f)+(255-r)*f;g=g*(1-f)+(255-g)*f;b=b*(1-f)+(255-b)*f;const idx=(j*W+i)*4;D[idx]=r;D[idx+1]=g;D[idx+2]=b;D[idx+3]=255;}x.putImageData(img,0,0);requestAnimationFrame(frame);}requestAnimationFrame(frame);</script></body></html>
