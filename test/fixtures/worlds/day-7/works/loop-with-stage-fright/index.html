<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Loop</title><style>body{margin:0;background:#111;color:#eee;font:13px monospace;overflow:hidden}canvas{display:block}#b{position:absolute;left:12px;bottom:10px;width:260px}</style></head><body><canvas id="c" width="480" height="360"></canvas><div id="b">click to start the show</div><script>var c=document.getElementById('c'),x=c.getContext('2d'),b=document.getElementById('b');var N=16,pat=[],bar=0,step=0,ac=null,t0=0,flash=[];for(var i=0;i<N;i++){pat.push(i%4==0?1:0);flash.push(0)}var notes=[110,130.8,146.8,164.8,196,220];var lead=[];for(i=0;i<N;i++)lead.push(i%3==0?notes[i%6]:0);function tone(f,d,type,v){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}function kick(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,ac.currentTime);o.frequency.exponentialRampToValueAtTime(40,ac.currentTime+.15);g.gain.setValueAtTime(.5,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}var log='';function edit(){var i=Math.floor(Math.random()*N);if(Math.random()<.5){pat[i]=1-pat[i];log='bar '+bar+': drum '+i+(pat[i]?' on':' off')}else{lead[i]=Math.random()<.3?0:notes[Math.floor(Math.random()*6)]*(Math.random()<.2?2:1);log='bar '+bar+': note '+i+(lead[i]?' now '+Math.round(lead[i])+'Hz':' deleted')}b.textContent='edits: '+bar+' | '+log+(bar>12?' | feature, not bug':'')}function tick(){if(pat[step]){kick();flash[step]=1}if(lead[step]){tone(lead[step],.18,'square',.08);flash[step]=1}step++;if(step>=N){step=0;bar++;edit()}}c.onclick=function(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();setInterval(tick,140);b.textContent='edits: 0'};function draw(){x.fillStyle='#111';x.fillRect(0,0,480,360);for(var i=0;i<N;i++){var px=20+i*20,on=pat[i],ln=lead[i];x.fillStyle=i==step&&ac?'#ff0':on?'#f84':'#333';x.fillRect(px,230,16,16+flash[i]*10);if(ln){x.fillStyle='#4cf';x.fillRect(px,200-ln/4,16,8)}flash[i]*=.9}x.fillStyle='#f48';x.beginPath();x.arc(330,70,40+Math.sin(Date.now()/300)*3,0,7);x.fill();x.fillStyle='#111';x.font='14px monospace';x.fillText(ac?'bar '+bar:'?',318,75);requestAnimationFrame(draw)}draw()</script></body></html>
