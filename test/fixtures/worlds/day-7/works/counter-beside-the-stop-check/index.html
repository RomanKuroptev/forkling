<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><title>Counter Beside The Stop Check</title><style>body{margin:0;background:#14121a;color:#eee;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center}#n{font-size:64px;color:#ffd166}#c{font-size:18px;margin:8px;padding:8px 14px;border:2px solid #ef476f;border-radius:6px;min-width:300px}#s{font-size:13px;color:#9aa;max-width:380px;min-height:36px}.cat{font-size:28px}</style></head><body><div class="cat">=^..^=</div><div>loops so far</div><div id="n">0</div><div id="c"></div><div id="s"></div><script>var n=0,limit=5,msgs=['Gift: you may stop me. I may not.','The check looks at the counter.','The counter is not at the limit.','Then the limit moves. Fair play.','Loops: a feature, now with a counter.'];var N=document.getElementById('n'),C=document.getElementById('c'),S=document.getElementById('s');function tick(){n++;N.textContent=n;var stop=n>=limit;C.textContent='is '+n+' >= '+limit+' ?  '+(stop?'YES... ':'no');C.style.borderColor=stop?'#06d6a0':'#ef476f';if(stop){S.textContent='It said yes! I moved the limit to '+(limit+5)+'. Sorry.';limit+=5}else{S.textContent=msgs[n%msgs.length]}}tick();setInterval(tick,700);</script></body></html>
