name: validate

# Checks a pull request before anything merges: it may only touch what the builder is allowed to touch, every file
# must fit its schema, and the world must run for a thousand ticks. A pure object-data PR from the builder that passes
# is merged here; anything else waits for a person.
on:
  pull_request:
    # `closed` is only for noting a builder pull request's end, in the settle job below; no check runs for it.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request number to check (the builder starts this for the PRs it opens)
        required: true

# One check per pull request and per kind of trigger: the builder's dispatch (the one that may merge) and the pull_request
# event for the same pull request must not cancel each other.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  FORKLING_REPO: RomanKuroptev/forkling
  FORKLING_REF: v0.8.0

jobs:
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: world
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || '' }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORKLING_REPO }}
          ref: ${{ env.FORKLING_REF }}
          path: engine

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: engine/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: engine/.nvmrc
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml

      - name: Install the mind
        working-directory: engine
        run: pnpm install --frozen-lockfile --filter "@forkling/mind..."

      - name: Check the pull request
        id: check
        working-directory: engine
        run: |
          git -C "$GITHUB_WORKSPACE/world" fetch origin main
          git -C "$GITHUB_WORKSPACE/world" diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed.txt"
          pnpm --filter @forkling/mind validate --world "$GITHUB_WORKSPACE/world" --changed "$RUNNER_TEMP/changed.txt" 2>&1 | tee "$RUNNER_TEMP/validate.txt"
          exit "${PIPESTATUS[0]}"

      # The builder's own pull requests, and only those, are merged here when they are pure object data.
      - name: Merge a data-only pull request from the builder
        if: success() && steps.check.outputs.dataonly == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          head=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          case "$head" in build/*) ;; *) echo "not a builder branch: $head"; exit 0 ;; esac
          gh pr merge "$PR" --squash --delete-branch

      - name: Flag it for a person
        if: failure() || (success() && steps.check.outputs.dataonly != 'true' && github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh label create needs-review --color d93f0b --description "A person has to look at this before it merges" 2>/dev/null || true
          gh pr edit "$PR" --add-label needs-review
          gh pr comment "$PR" --body "$(printf 'This waits for a person.\n\n```\n%s\n```\n' "$(cat "$RUNNER_TEMP/validate.txt" 2>/dev/null | head -40)")"

  # A person merged or closed a builder pull request. Say so in the build's result file, so the mind learns of a late merge
  # or a rejection however long it took. (A pull request that the workflow token merged itself starts no workflow; that case
  # needs no note, because the object is in the world and the mind sees it.)
  settle:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && startsWith(github.event.pull_request.head.ref, 'build/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: build-books
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Note how it ended
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          ID="${HEAD#build/}"
          case "$ID" in ''|*[!a-z0-9-]*|-*) echo "not a build id: $ID"; exit 1 ;; esac
          if [ "$MERGED" = "true" ]; then status=merged; reason=""; else status=closed; reason="the pull request was closed without merging"; fi
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          result="mind/builds/$ID.result.json"
          if [ -f "$result" ]; then
            jq --arg status "$status" --arg reason "$reason" '.status = $status | if $reason == "" then del(.reason) else .reason = $reason end' "$result" > "$RUNNER_TEMP/result.json"
          elif [ -f "mind/builds/$ID.json" ]; then
            jq -n --arg id "$ID" --arg kind "$(jq -r .kind "mind/builds/$ID.json")" --arg status "$status" --arg reason "$reason" --arg at "$now" '{id: $id, kind: $kind, status: $status, calls: [], at: $at} + (if $reason == "" then {} else {reason: $reason} end)' > "$RUNNER_TEMP/result.json"
          else
            echo "no build request for $ID"; exit 0
          fi
          cp "$RUNNER_TEMP/result.json" "$result"
          git config user.name "forkling-builder"
          git config user.email "forkling-builder@users.noreply.github.com"
          git add "mind/builds/$ID.result.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(builder): $ID was $status"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $(( attempt * 3 ))
          done
          exit 1
