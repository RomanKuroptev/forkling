name: mind

# The forkling's mind: one tick every 10 minutes (GitHub may run it a few minutes late; nothing here assumes exact
# times), plus an immediate tick when the viewer reports a visitor event. While the forkling sleeps, only the first
# tick of each hour does anything.
on:
  schedule:
    - cron: '3-59/10 * * * *'
  repository_dispatch:
    types: [visitor-event]
  workflow_dispatch:

# Ticks must never overlap: two minds writing one repo would corrupt its state.
concurrency:
  group: mind
  cancel-in-progress: false

permissions:
  contents: write
  # Lets it start the website build (see the last step).
  actions: write
  # Lets the job ask GitHub for an identity token, so no API key has to be stored (see the README).
  id-token: write

env:
  # The engine release this world runs on. Change it on purpose, after reading what changed.
  FORKLING_REPO: RomanKuroptev/forkling
  FORKLING_REF: v0.6.0

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: world

      - name: Decide whether to tick
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          asleep=$(jq -r '.asleep // false' world/forkling.json)
          last=$(jq -r '.lastTickAt' world/forkling.json)
          minute=$((10#$(date -u +%M)))
          run=true
          if [ "$EVENT" = repository_dispatch ]; then
            # A burst of visitors counts as one: at most one event-driven tick every 2 minutes.
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "$age" -lt 120 ]; then run=false; fi
          elif [ "$asleep" = true ] && [ "$minute" -ge 10 ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          repository: ${{ env.FORKLING_REPO }}
          ref: ${{ env.FORKLING_REF }}
          path: engine

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          package_json_file: engine/package.json

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: engine/.nvmrc
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml

      - name: Install the mind
        if: steps.gate.outputs.run == 'true'
        working-directory: engine
        run: pnpm install --frozen-lockfile --filter "@forkling/mind..."

      # Keyless auth: when the four repository variables are set, trade GitHub's identity token for a short-lived
      # Anthropic one. A fresh token each tick, because Anthropic accepts each identity token only once.
      - name: Fetch identity token
        if: steps.gate.outputs.run == 'true' && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          token_file="$RUNNER_TEMP/anthropic-identity-token"
          curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$token_file"
          {
            echo "ANTHROPIC_FEDERATION_RULE_ID=$ANTHROPIC_FEDERATION_RULE_ID"
            echo "ANTHROPIC_ORGANIZATION_ID=$ANTHROPIC_ORGANIZATION_ID"
            echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$ANTHROPIC_SERVICE_ACCOUNT_ID"
            echo "ANTHROPIC_WORKSPACE_ID=$ANTHROPIC_WORKSPACE_ID"
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$token_file"
          } >> "$GITHUB_ENV"

      - name: Tick
        id: tick
        if: steps.gate.outputs.run == 'true'
        working-directory: engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # An unset secret arrives as an empty variable, which would still outrank federation.
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
          pnpm --filter @forkling/mind tick --world "$GITHUB_WORKSPACE/world"

      - name: Commit what changed
        if: steps.gate.outputs.run == 'true' && steps.tick.outputs.changed == 'true'
        working-directory: world
        env:
          SUMMARY: ${{ steps.tick.outputs.summary }}
        run: |
          git config user.name "forkling-mind"
          git config user.email "forkling-mind@users.noreply.github.com"
          git add -A
          git commit -m "chore(mind): ${SUMMARY:-tick}"
          # Another run or a merged PR may have landed since checkout.
          git pull --rebase
          git push

      # The website is built from the files of this repo, so rebuild it when one of them changed. Dispatches that arrive
      # while a build runs collapse into one waiting build (see pages.yml).
      - name: Update the website
        if: steps.gate.outputs.run == 'true' && steps.tick.outputs.changed == 'true'
        working-directory: world
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(journal/|art/|notebook/|memory/beliefs\.json|memory/timeline/|brain/interests\.json)'; then
            gh workflow run pages.yml || echo "could not start the website build (is pages.yml on this branch?)"
          fi
