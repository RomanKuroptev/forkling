name: QA behaviour

# The audit harness's fake behaviour run (docs/spec/audit/spec.md 9.1, steps QB.9): 30 simulated days, 3 seeds, on the scripted
# fake model and the committed web snapshot. Free: no model key, no network beyond GitHub. It checks engine logic over many
# days: crashes, rails, money that adds up, growth that triggers, a verb that never runs, a plan check that turns everything
# down. Fakes cannot judge taste; real runs do that, by hand, under the harness budget.
#
# Started by hand only (Roman, 19 November 2026: no schedules in Phase 1): the "Run workflow" button, or
#   gh workflow run qa-behaviour.yml
#   gh workflow run qa-behaviour.yml -f days=7 -f seeds=1 -f scenario=no-memes
#
# Planned time, switched on only when Roman says so:
# on:
#   schedule:
#     - cron: '0 2 * * *'   # nightly, 03:00 Stockholm in winter (02:00 UTC)
on:
  workflow_dispatch:
    inputs:
      days:
        description: Simulated days
        default: '30'
      seeds:
        description: Seeds (runs with different world seeds and start dates)
        default: '3'
      scenario:
        description: The fake model
        type: choice
        options: [plain, same-topic, no-memes, rest-40]
        default: plain

jobs:
  behaviour:
    runs-on: ubuntu-latest
    # About 2 minutes per simulated day per seed on the fakes.
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fake behaviour run
        env:
          DAYS: ${{ inputs.days }}
          SEEDS: ${{ inputs.seeds }}
          SCENARIO: ${{ inputs.scenario }}
        run: pnpm qa behaviour --fake --days "$DAYS" --seeds "$SEEDS" --scenario "$SCENARIO" --label actions-fake
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-behaviour
          # The report, findings and scores; the worlds are large and stay out.
          path: |
            qa-out/behaviour/actions-fake/report.md
            qa-out/behaviour/actions-fake/findings.json
            qa-out/behaviour/actions-fake/scores.json
            qa-out/behaviour/actions-fake/seed-*/out/summary.md
            qa-out/behaviour/actions-fake/seed-*/out/run-report.txt
          if-no-files-found: warn
          retention-days: 30
