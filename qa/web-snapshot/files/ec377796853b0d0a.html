e":[0,"square()"],"module":[0,"Shape"],"submodule":[0,"2D Primitives"],"file":[0,"src/shape/2d_primitives.js"],"description":[0,"<p>Draws a square.</p>\n<p>A square is a four-sided shape defined by the <code>x</code>, <code>y</code>, and <code>s</code>\nparameters. <code>x</code> and <code>y</code> set the location of its top-left corner. <code>s</code> sets\nits width and height. Every angle in the square measures 90˚ and all its\nsides are the same length. See <a href=\"/reference/p5/rectMode/\">rectMode()</a> for\nother ways to define squares.</p>\n<p>The version of <code>square()</code> with four parameters creates a rounded square.\nThe fourth parameter sets the radius for all four corners.</p>\n<p>The version of <code>square()</code> with seven parameters also creates a rounded\nsquare. Each of the last four parameters set the radius of a corner. The\nradii start with the top-left corner and move clockwise around the\nsquare. If any of these parameters are omitted, they are set to the\nvalue of the last radius that was set.</p>\n"],"line":[0,1197],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"x"],"description":[0,"x-coordinate of the square."],"type":[0,"Number"]}],[0,{"name":[0,"y"],"description":[0,"y-coordinate of the square."],"type":[0,"Number"]}],[0,{"name":[0,"s"],"description":[0,"side size of the square."],"type":[0,"Number"]}],[0,{"name":[0,"tl"],"description":[0,"optional radius of top-left corner."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"tr"],"description":[0,"optional radius of top-right corner."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"br"],"description":[0,"optional radius of bottom-right corner."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"bl"],"description":[0,"optional radius of bottom-left corner."],"type":[0,"Number"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"function setup() {\n  createCanvas(100, 100);\n\n  background(200);\n\n  square(30, 20, 55);\n\n  describe(&apos;A white square with a black outline in on a gray canvas.&apos;);\n}"],[0,"function setup() {\n  createCanvas(100, 100);\n\n  background(200);\n\n  // Give all corners a radius of 20.\n  square(30, 20, 55, 20);\n\n  describe(\n    &apos;A white square with a black outline and round edges on a gray canvas.&apos;\n  );\n}"],[0,"function setup() {\n  createCanvas(100, 100);\n\n  background(200);\n\n  // Give each corner a unique radius.\n  square(30, 20, 55, 20, 15, 10, 5);\n\n  describe(&apos;A white square with a black outline and round edges of different radii.&apos;);\n}"],[0,"function setup() {\n  createCanvas(100, 100, WEBGL);\n\n  background(200);\n\n  square(-20, -30, 55);\n\n  describe(&apos;A white square with a black outline in on a gray canvas.&apos;);\n}"],[0,"function setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white square spins around on gray canvas.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Rotate around the y-axis.\n  rotateY(frameCount * 0.01);\n\n  // Draw the square.\n  square(-20, -30, 55);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/square"]}],"body":[0,"# square"],"filePath":[0,"src/content/reference/en/p5/square.mdx"],"digest":[0,"9d5e6dd93b73887c"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/triangle"],"data":[0,{"title":[0,"triangle()"],"module":[0,"Shape"],"submodule":[0,"2D Primitives"],"file":[0,"src/shape/2d_primitives.js"],"description":[0,"<p>Draws a triangle.</p>\n<p>A triangle is a three-sided shape defined by three points. The\nfirst two parameters specify the triangle&apos;s first point <code>(x1, y1)</code>. The\nmiddle two parameters specify its second point <code>(x2, y2)</code>. And the last two\nparameters specify its third point <code>(x3, y3)</code>.</p>\n"],"line":[0,1300],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"x1"],"description":[0,"x-coordinate of the first point."],"type":[0,"Number"]}],[0,{"name":[0,"y1"],"description":[0,"y-coordinate of the first point."],"type":[0,"Number"]}],[0,{"name":[0,"x2"],"description":[0,"x-coordinate of the second point."],"type":[0,"Number"]}],[0,{"name":[0,"y2"],"description":[0,"y-coordinate of the second point."],"type":[0,"Number"]}],[0,{"name":[0,"x3"],"description":[0,"x-coordinate of the third point."],"type":[0,"Number"]}],[0,{"name":[0,"y3"],"description":[0,"y-coordinate of the third point."],"type":[0,"Number"]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"function setup() {\n  createCanvas(100, 100);\n\n  background(200);\n\n  triangle(30, 75, 58, 20, 86, 75);\n\n  describe(&apos;A white triangle with a black outline on a gray canvas.&apos;);\n}"],[0,"function setup() {\n  createCanvas(100, 100, WEBGL);\n\n  background(200);\n\n  triangle(-20, 25, 8, -30, 36, 25);\n\n  describe(&apos;A white triangle with a black outline on a gray canvas.&apos;);\n}"],[0,"function setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white triangle spins around on a gray canvas.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Rotate around the y-axis.\n  rotateY(frameCount * 0.01);\n\n  // Draw the triangle.\n  triangle(-20, 25, 8, -30, 36, 25);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/triangle"]}],"body":[0,"# triangle"],"filePath":[0,"src/content/reference/en/p5/triangle.mdx"],"digest":[0,"567d6233f9f3ab33"],"deferredRender":[0,true],"collection":[0,"reference"]}]]]}],[0,{"name":[0,"3D Models"],"entry":[0],"entries":[1,[[0,{"id":[0,"en/p5/createModel"],"data":[0,{"title":[0,"createModel()"],"module":[0,"Shape"],"submodule":[0,"3D Models"],"file":[0,"src/webgl/loading.js"],"description":[0,"<p>Load a 3d model from an OBJ or STL string.</p>\n<p>OBJ and STL files lack a built-in sense of scale, causing models exported from different programs to vary in size.\nIf your model doesn&apos;t display correctly, consider using <code>loadModel()</code> with <code>normalize</code> set to <code>true</code> to standardize its size.\nFurther adjustments can be made using the <code>scale()</code> function.</p>\n<p>Also, the support for colored STL files is not present. STL files with color will be\nrendered without color properties.</p>\n<ul><li>Options can include:</li></ul><ul><li><code>modelString</code>: Specifies the plain text string of either an stl or obj file to be loaded.</li><li><code>fileType</code>: Defines the file extension of the model.</li><li><code>normalize</code>: Enables standardized size scaling during loading if set to true.</li><li><code>successCallback</code>: Callback for post-loading actions with the 3D model object.</li><li><code>failureCallback</code>: Handles errors if model loading fails, receiving an event error.</li><li><code>flipU</code>: Flips the U texture coordinates of the model.</li><li><code>flipV</code>: Flips the V texture coordinates of the model.</li></ul>"],"line":[0,1445],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"modelString"],"description":[0,"String of the object to be loaded"],"type":[0,"String"]}],[0,{"name":[0,"fileType"],"description":[0,"The file extension of the model\n(<code>.stl</code>, <code>.obj</code>)."],"type":[0,"String"],"optional":[0,true]}],[0,{"name":[0,"normalize"],"description":[0,"If true, scale the model to a\nstandardized size when loading"],"type":[0,"Boolean"],"optional":[0,true]}],[0,{"name":[0,"successCallback"],"description":[0,"Function to be called\nonce the model is loaded. Will be passed\nthe 3D model object."],"type":[0,"function(p5.Geometry)"],"optional":[0,true]}],[0,{"name":[0,"failureCallback"],"description":[0,"called with event error if\nthe model fails to load."],"type":[0,"function(Event)"],"optional":[0,true]}]]]}],[0,{"params":[1,[[0,{"name":[0,"modelString"],"description":[0,""],"type":[0,"String"]}],[0,{"name":[0,"fileType"],"description":[0,""],"type":[0,"String"],"optional":[0,true]}],[0,{"name":[0,"successCallback"],"description":[0,""],"type":[0,"function(p5.Geometry)"],"optional":[0,true]}],[0,{"name":[0,"failureCallback"],"description":[0,""],"type":[0,"function(Event)"],"optional":[0,true]}]]]}],[0,{"params":[1,[[0,{"name":[0,"modelString"],"description":[0,""],"type":[0,"String"]}],[0,{"name":[0,"fileType"],"description":[0,""],"type":[0,"String"],"optional":[0,true]}],[0,{"name":[0,"options"],"description":[0,""],"type":[0,"Object"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"return":[0,{"description":[0,"the <a href=\"#/p5.Geometry\">p5.Geometry</a> object"],"type":[0,"p5.Geometry"]}],"example":[1,[[0,"const octahedron_model = `\nv 0.000000E+00 0.000000E+00 40.0000\nv 22.5000 22.5000 0.000000E+00\nv 22.5000 -22.5000 0.000000E+00\nv -22.5000 -22.5000 0.000000E+00\nv -22.5000 22.5000 0.000000E+00\nv 0.000000E+00 0.000000E+00 -40.0000\nf     1 2 3\nf     1 3 4\nf     1 4 5\nf     1 5 2\nf     6 5 4\nf     6 4 3\nf     6 3 2\nf     6 2 5\n`;\n//draw a spinning octahedron\nlet octahedron;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n  octahedron = createModel(octahedron_model, &apos;.obj&apos;);\n  describe(&apos;Vertically rotating 3D octahedron.&apos;);\n}\n\nfunction draw() {\n  background(200);\n  rotateX(frameCount * 0.01);\n  rotateY(frameCount * 0.01);\n  model(octahedron);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/createModel"]}],"body":[0,"# createModel"],"filePath":[0,"src/content/reference/en/p5/createModel.mdx"],"digest":[0,"dcc6789dd18199a2"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/loadModel"],"data":[0,{"title":[0,"loadModel()"],"module":[0,"Shape"],"submodule":[0,"3D Models"],"file":[0,"src/webgl/loading.js"],"description":[0,"<p>Loads a 3D model to create a\n<a href=\"/reference/p5/p5.Geometry\"><code>p5.Geometry</code></a> object.</p>\n<p><code>loadModel()</code> can load 3D models from OBJ and STL files. Once the model is\nloaded, it can be displayed with the\n<a href=\"/reference/p5/model/\"><code>model()</code></a> function, as in <code>model(shape)</code>.</p>\n<p>There are three ways to call <code>loadModel()</code> with optional parameters to help\nprocess the model.</p>\n<p>The first parameter, <code>path</code>, is a <code>String</code> with the path to the file. Paths\nto local files should be relative, as in <code>loadModel(&apos;/assets/model.obj&apos;)</code>.\nURLs such as <code>&apos;https://example.com/model.obj&apos;</code> may be blocked due to browser\nsecurity. The <code>path</code> parameter can also be defined as a <code>Request</code>\nobject for more advanced usage.\nNote: When a <code>.obj</code> file references materials stored in a <code>.mtl</code> file,\np5.js loads and applies them, so a model with several materials appears the\nway it was exported. Each material can use diffuse (<code>map_Kd</code>), specular\n(<code>map_Ks</code>), ambient (<code>map_Ka</code>), shininess (<code>map_Ns</code>), bump (<code>map_Bump</code>),\nand normal (<code>norm</code>) texture maps. A bump map is read as a height map, while\n<code>norm</code> is read as a tangent-space normal map. Keep the <code>.mtl</code> file and its\nimages alongside the <code>.obj</code> file so their paths resolve. A texture that\nfails to load is skipped with a warning instead of failing the whole model.</p>\n<p>The first way to call <code>loadModel()</code> has three optional parameters after the\nfile path. The first optional parameter, <code>successCallback</code>, is a function\nto call once the model loads. For example,\n<code>loadModel(&apos;/assets/model.obj&apos;, handleModel)</code> will call the <code>handleModel()</code>\nfunction once the model loads. The second optional parameter,\n<code>failureCallback</code>, is a function to call if the model fails to load. For\nexample, <code>loadModel(&apos;/assets/model.obj&apos;, handleModel, handleFailure)</code> will\ncall the <code>handleFailure()</code> function if an error occurs while loading. The\nthird optional parameter, <code>fileType</code>, is the model’s file extension as a\nstring. For example,\n<code>loadModel(&apos;/assets/model&apos;, handleModel, handleFailure, &apos;.obj&apos;)</code> will try to\nload the file model as a <code>.obj</code> file.</p>\n<p>The second way to call <code>loadModel()</code> has four optional parameters after the\nfile path. The first optional parameter is a <code>Boolean</code> value. If <code>true</code> is\npassed, as in <code>loadModel(&apos;/assets/model.obj&apos;, true)</code>, then the model will be\nresized to ensure it fits the canvas. The next three parameters are\n<code>successCallback</code>, <code>failureCallback</code>, and <code>fileType</code> as described above.</p>\n<p>The third way to call <code>loadModel()</code> has one optional parameter after the\nfile path. The optional parameter, <code>options</code>, is an <code>Object</code> with options,\nas in <code>loadModel(&apos;/assets/model.obj&apos;, options)</code>. The <code>options</code> object can\nhave the following properties:</p>\n<pre><code class=\"language-js\">let options = {\n  // Enables standardized size scaling during loading if set to true.\n  normalize: true,\n\n  // Function to call once the model loads.\n  successCallback: handleModel,\n\n  // Function to call if an error occurs while loading.\n  failureCallback: handleError,\n\n  // Model&apos;s file extension.\n  fileType: &apos;.stl&apos;,\n\n  // Flips the U texture coordinates of the model.\n  flipU: false,\n\n  // Flips the V texture coordinates of the model.\n  flipV: false\n};\n\n// Pass the options object to loadModel().\nloadModel(&apos;/assets/model.obj&apos;, options);</code></pre><p>This function returns a <code>Promise</code> and should be used in an <code>async</code> setup with\n<code>await</code>. See the examples for the usage syntax.</p>\n<p>Note: There’s no support for colored STL files. STL files with color will\nbe rendered without color.</p>\n"],"line":[0,561],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"path"],"description":[0,"path of the model to be loaded."],"type":[0,"String|Request"]}],[0,{"name":[0,"fileType"],"description":[0,"model’s file extension. Either <code>&apos;.obj&apos;</code> or <code>&apos;.stl&apos;</code>."],"type":[0,"String"],"optional":[0,true]}],[0,{"name":[0,"normalize"],"description":[0,"if <code>true</code>, scale the model to fit the canvas."],"type":[0,"Boolean"],"optional":[0,true]}],[0,{"name":[0,"successCallback"],"description":[0,"function to call once the model is loaded. Will be passed\nthe <a href=\"#/p5.Geometry\"><code>p5.Geometry</code></a> object."],"type":[0,"function(p5.Geometry)"],"optional":[0,true]}],[0,{"name":[0,"failureCallback"],"description":[0,"function to call if the model fails to load. Will be passed an <code>Error</code> event object."],"type":[0,"function(Event)"],"optional":[0,true]}]]]}],[0,{"params":[1,[[0,{"name":[0,"path"],"description":[0,""],"type":[0,"String|Request"]}],[0,{"name":[0,"fileType"],"description":[0,""],"type":[0,"String"],"optional":[0,true]}],[0,{"name":[0,"successCallback"],"description":[0,""],"type":[0,"function(p5.Geometry)"],"optional":[0,true]}],[0,{"name":[0,"failureCallback"],"description":[0,""],"type":[0,"function(Event)"],"optional":[0,true]}]]]}],[0,{"params":[1,[[0,{"name":[0,"path"],"description":[0,""],"type":[0,"String|Request"]}],[0,{"name":[0,"normalize"],"description":[0,""],"type":[0,"Boolean"]}],[0,{"name":[0,"successCallback"],"description":[0,""],"type":[0,"function(p5.Geometry)"],"optional":[0,true]}],[0,{"name":[0,"failureCallback"],"description":[0,""],"type":[0,"function(Event)"],"optional":[0,true]}]]]}],[0,{"params":[1,[[0,{"name":[0,"path"],"description":[0,""],"type":[0,"String|Request"]}],[0,{"name":[0,"options"],"description":[0,"loading options."],"type":[0,"Object"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"return":[0,{"description":[0,"the <a href=\"#/p5.Geometry\"><code>p5.Geometry</code></a> object"],"type":[0,"Promise<p5.Geometry>"]}],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\n// Load the file and create a p5.Geometry object.\nasync function setup() {\n  shape = await loadModel(&apos;/assets/teapot.obj&apos;);\n\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white teapot drawn against a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the shape.\n  model(shape);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\n// Load the file and create a p5.Geometry object.\n// Normalize the geometry&apos;s size to fit the canvas.\nasync function setup() {\n  shape = await loadModel(&apos;/assets/teapot.obj&apos;, true);\n\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white teapot drawn against a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the shape.\n  model(shape);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\n// Load the file and create a p5.Geometry object.\nasync function setup() {\n  await loadModel(&apos;/assets/teapot.obj&apos;, true, handleModel);\n\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white teapot drawn against a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the shape.\n  model(shape);\n}\n\n// Set the shape variable and log the geometry&apos;s\n// ID to the console.\nfunction handleModel(data) {\n  shape = data;\n  console.log(shape.gid);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\n// Load the file and create a p5.Geometry object.\nasync function setup() {\n  await loadModel(&apos;/assets/teapot.obj&apos;, true, handleModel, handleError);\n\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white teapot drawn against a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the shape.\n  model(shape);\n}\n\n// Set the shape variable and print the geometry&apos;s\n// ID to the console.\nfunction handleModel(data) {\n  shape = data;\n  console.log(shape.gid);\n}\n\n// Print an error message if the file doesn&apos;t load.\nfunction handleError(error) {\n  console.error(&apos;Oops!&apos;, error);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\n// Load the file and create a p5.Geometry object.\nasync function setup() {\n  await loadModel(&apos;/assets/teapot.obj&apos;, &apos;.obj&apos;, true, handleModel, handleError);\n\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white teapot drawn against a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the shape.\n  model(shape);\n}\n\n// Set the shape variable and print the geometry&apos;s\n// ID to the console.\nfunction handleModel(data) {\n  shape = data;\n  console.log(shape.gid);\n}\n\n// Print an error message if the file doesn&apos;t load.\nfunction handleError(error) {\n  console.error(&apos;Oops!&apos;, error);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\nlet options = {\n  fileType: &apos;.obj&apos;,\n  normalize: true,\n  successCallback: handleModel,\n  failureCallback: handleError\n};\n\n// Load the file and create a p5.Geometry object.\nasync function setup() {\n  await loadModel(&apos;/assets/teapot.obj&apos;, options);\n\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white teapot drawn against a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the shape.\n  model(shape);\n}\n\n// Set the shape variable and print the geometry&apos;s\n// ID to the console.\nfunction handleModel(data) {\n  shape = data;\n  console.log(shape.gid);\n}\n\n// Print an error message if the file doesn&apos;t load.\nfunction handleError(error) {\n  console.error(&apos;Oops!&apos;, error);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/loadModel"]}],"body":[0,"# loadModel"],"filePath":[0,"src/content/reference/en/p5/loadModel.mdx"],"digest":[0,"45b7eee576164165"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/model"],"data":[0,{"title":[0,"model()"],"module":[0,"Shape"],"submodule":[0,"3D Models"],"file":[0,"src/webgl/loading.js"],"description":[0,"<p>Draws a <a href=\"/reference/p5/p5.Geometry\"><code>p5.Geometry</code></a> object to the canvas.</p>\n<p>The first parameter, <code>model</code>, is the\n<a href=\"/reference/p5/p5.Geometry\"><code>p5.Geometry</code></a> object to draw.\n<a href=\"/reference/p5/p5.Geometry\"><code>p5.Geometry</code></a> objects can be built with\n<a href=\"/reference/p5/buildGeometry/\"><code>buildGeometry()</code></a>. They can also be loaded from\na file with <a href=\"/reference/p5/loadGeometry/\"><code>loadGeometry()</code></a>.</p>\n<p>Note: <code>model()</code> can only be used in WebGL mode.</p>\n<p>A model with several materials, such as a character with separate skin,\nshirt, and shoe materials, keeps each material&apos;s own colors and textures.\nThe call to <code>model()</code> is the same whether the model has one material or\nmany, so a model made in software such as Blender appears the way it was\nexported.</p>\n<pre><code class=\"language-js example\">// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  // Create the p5.Geometry object.\n  shape = buildGeometry(createShape);\n\n  describe(&apos;A white cone drawn on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the p5.Geometry object.\n  model(shape);\n}\n\n// Create p5.Geometry object from a single cone.\nfunction createShape() {\n  cone();\n}</code></pre><pre><code class=\"language-js example\">// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  // Create the p5.Geometry object.\n  shape = buildGeometry(createArrow);\n\n  describe(&apos;Two white arrows drawn on a gray background. The arrow on the right rotates slowly.&apos;);\n}\n\nfunction draw() {\n  background(50);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Turn on the lights.\n  lights();\n\n  // Style the arrows.\n  noStroke();\n\n  // Draw the p5.Geometry object.\n  model(shape);\n\n  // Translate and rotate the coordinate system.\n  translate(30, 0, 0);\n  rotateZ(frameCount * 0.01);\n\n  // Draw the p5.Geometry object again.\n  model(shape);\n}\n\nfunction createArrow() {\n  // Add shapes to the p5.Geometry object.\n  push();\n  rotateX(PI);\n  cone(10);\n  translate(0, -10, 0);\n  cylinder(3, 20);\n  pop();\n}</code></pre><pre><code class=\"language-js example\">// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\nasync function setup() {\n  shape = await loadModel(&apos;/assets/octahedron.obj&apos;);\n\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white octahedron drawn against a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the shape.\n  model(shape);\n}</code></pre><p>Multiple instances can be drawn at once with <code>instances(count)</code>. On its own,\nall the instances get drawn to the same spot, but you can use\n<a href=\"/reference/p5/instanceIndex/\"><code>instanceIndex</code></a> inside of a shader to handle each instance.\nAt large counts, this often runs faster than using a <code>for</code> loop.</p>\n<pre><code class=\"language-js example\">let instancesShader;\nlet count = 5;\n\nfunction setup() {\n  createCanvas(200, 200, WEBGL);\n  instancesShader = buildMaterialShader(drawSpaced);\n}\n\nfunction drawSpaced() {\n  worldInputs.begin();\n  // Spread spheres evenly across the canvas based on their index\n  let spacing = width / count;\n  worldInputs.position.x +=\n    (instanceIndex - (count - 1) / 2) * spacing;\n  worldInputs.end();\n}\n\nfunction draw() {\n  background(220);\n  lights();\n  noStroke();\n  fill(&apos;red&apos;);\n  shader(instancesShader);\n  instances(count).sphere(15);\n}</code></pre>"],"line":[0,1353],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"model"],"description":[0,"3D shape to be drawn."],"type":[0,"p5.Geometry"]}],[0,{"name":[0,"count"],"description":[0,"number of instances to draw."],"type":[0,"Number"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[]],"isConstructor":[0,false],"path":[0,"p5/model"]}],"body":[0,"# model"],"filePath":[0,"src/content/reference/en/p5/model.mdx"],"digest":[0,"08fee6ed707a881b"],"deferredRender":[0,true],"collection":[0,"reference"]}]]]}],[0,{"name":[0,"3D Primitives"],"entry":[0],"entries":[1,[[0,{"id":[0,"en/p5/box"],"data":[0,{"title":[0,"box()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Draws a box (rectangular prism).</p>\n<p>A box is a 3D shape with six faces. Each face makes a 90˚ with four\nneighboring faces.</p>\n<p>The first parameter, <code>width</code>, is optional. If a <code>Number</code> is passed, as in\n<code>box(20)</code>, it sets the box’s width and height. By default, <code>width</code> is 50.</p>\n<p>The second parameter, <code>height</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>box(20, 30)</code>, it sets the box’s height. By default, <code>height</code> is set\nto the box’s <code>width</code>.</p>\n<p>The third parameter, <code>depth</code>, is also optional. If a <code>Number</code> is passed, as\nin <code>box(20, 30, 40)</code>, it sets the box’s depth. By default, <code>depth</code> is set\nto the box’s <code>height</code>.</p>\n<p>The fourth parameter, <code>detailX</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>box(20, 30, 40, 5)</code>, it sets the number of triangle subdivisions to\nuse along the x-axis. All 3D shapes are made by connecting triangles to\nform their surfaces. By default, <code>detailX</code> is 1.</p>\n<p>The fifth parameter, <code>detailY</code>, is also optional. If a number is passed, as\nin <code>box(20, 30, 40, 5, 7)</code>, it sets the number of triangle subdivisions to\nuse along the y-axis. All 3D shapes are made by connecting triangles to\nform their surfaces. By default, <code>detailY</code> is 1.</p>\n<p>Note: <code>box()</code> can only be used in WebGL mode.</p>\n"],"line":[0,615],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"width"],"description":[0,"width of the box."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"height"],"description":[0,"height of the box."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"depth"],"description":[0,"depth of the box."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"detailX"],"description":[0,"number of triangle subdivisions along the x-axis."],"type":[0,"Integer"],"optional":[0,true]}],[0,{"name":[0,"detailY"],"description":[0,"number of triangle subdivisions along the y-axis."],"type":[0,"Integer"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white box on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the box.\n  box();\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white box on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the box.\n  // Set its width and height to 30.\n  box(30);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white box on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the box.\n  // Set its width to 30 and height to 50.\n  box(30, 50);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white box on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the box.\n  // Set its width to 30, height to 50, and depth to 10.\n  box(30, 50, 10);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/box"]}],"body":[0,"# box"],"filePath":[0,"src/content/reference/en/p5/box.mdx"],"digest":[0,"a836be97bfe9f5c0"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/buildGeometry"],"data":[0,{"title":[0,"buildGeometry()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Creates a custom <a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a> object from\nsimpler 3D shapes.</p>\n<p><code>buildGeometry()</code> helps with creating complex 3D shapes from simpler ones\nsuch as <a href=\"/reference/p5/sphere/\">sphere()</a>. It can help to make sketches\nmore performant. For example, if a complex 3D shape doesn’t change while a\nsketch runs, then it can be created with <code>buildGeometry()</code>. Creating a\n<a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a> object once and then drawing it\nwill run faster than repeatedly drawing the individual pieces.</p>\n<p>The parameter, <code>callback</code>, is a function with the drawing instructions for\nthe new <a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a> object. It will be called\nonce to create the new 3D shape.\nNote: <code>buildGeometry()</code> can only be used in WebGL mode.</p>\n"],"line":[0,306],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"callback"],"description":[0,"function that draws the shape."],"type":[0,"Function"]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"return":[0,{"description":[0,"new 3D shape."],"type":[0,"p5.Geometry"]}],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  // Create the p5.Geometry object.\n  shape = buildGeometry(createShape);\n\n  describe(&apos;A white cone drawn on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(50);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Turn on the lights.\n  lights();\n\n  // Style the p5.Geometry object.\n  noStroke();\n\n  // Draw the p5.Geometry object.\n  model(shape);\n}\n\n// Create p5.Geometry object from a single cone.\nfunction createShape() {\n  cone();\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  // Create the arrow.\n  shape = buildGeometry(createArrow);\n\n  describe(&apos;A white arrow drawn on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(50);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Turn on the lights.\n  lights();\n\n  // Style the arrow.\n  noStroke();\n\n  // Draw the arrow.\n  model(shape);\n}\n\nfunction createArrow() {\n  // Add shapes to the p5.Geometry object.\n  push();\n  rotateX(PI);\n  cone(10);\n  translate(0, -10, 0);\n  cylinder(3, 20);\n  pop();\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet shape;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  // Create the p5.Geometry object.\n  shape = buildGeometry(createArrow);\n\n  describe(&apos;Two white arrows drawn on a gray background. The arrow on the right rotates slowly.&apos;);\n}\n\nfunction draw() {\n  background(50);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Turn on the lights.\n  lights();\n\n  // Style the arrows.\n  noStroke();\n\n  // Draw the p5.Geometry object.\n  model(shape);\n\n  // Translate and rotate the coordinate system.\n  translate(30, 0, 0);\n  rotateZ(frameCount * 0.01);\n\n  // Draw the p5.Geometry object again.\n  model(shape);\n}\n\nfunction createArrow() {\n  // Add shapes to the p5.Geometry object.\n  push();\n  rotateX(PI);\n  cone(10);\n  translate(0, -10, 0);\n  cylinder(3, 20);\n  pop();\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet button;\nlet particles;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  // Create a button to reset the particle system.\n  button = createButton(&apos;Reset&apos;);\n\n  // Call resetModel() when the user presses the button.\n  button.mousePressed(resetModel);\n\n  // Add the original set of particles.\n  resetModel();\n\n  describe(&apos;A set of white spheres on a gray background. The spheres are positioned randomly. Their positions reset when the user presses the Reset button.&apos;);\n}\n\nfunction draw() {\n  background(50);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Turn on the lights.\n  lights();\n\n  // Style the particles.\n  noStroke();\n\n  // Draw the particles.\n  model(particles);\n}\n\nfunction resetModel() {\n  // If the p5.Geometry object has already been created,\n  // free those resources.\n  if (particles) {\n    freeGeometry(particles);\n  }\n\n  // Create a new p5.Geometry object with random spheres.\n  particles = buildGeometry(createParticles);\n}\n\nfunction createParticles() {\n  for (let i = 0; i < 60; i += 1) {\n    // Calculate random coordinates.\n    let x = randomGaussian(0, 20);\n    let y = randomGaussian(0, 20);\n    let z = randomGaussian(0, 20);\n\n    push();\n    // Translate to the particle&apos;s coordinates.\n    translate(x, y, z);\n    // Draw the particle.\n    sphere(5);\n    pop();\n  }\n}"]]],"isConstructor":[0,false],"path":[0,"p5/buildGeometry"]}],"body":[0,"# buildGeometry"],"filePath":[0,"src/content/reference/en/p5/buildGeometry.mdx"],"digest":[0,"a906dd76bb6ae0d0"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/cone"],"data":[0,{"title":[0,"cone()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Draws a cone.</p>\n<p>A cone is a 3D shape with triangular faces that connect a flat bottom to a\nsingle point. Cones with few faces look like pyramids. Cones with many\nfaces have smooth surfaces.</p>\n<p>The first parameter, <code>radius</code>, is optional. If a <code>Number</code> is passed, as in\n<code>cone(20)</code>, it sets the radius of the cone’s base. By default, <code>radius</code> is\n50.</p>\n<p>The second parameter, <code>height</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>cone(20, 30)</code>, it sets the cone’s height. By default, <code>height</code> is\nset to the cone’s <code>radius</code>.</p>\n<p>The third parameter, <code>detailX</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>cone(20, 30, 5)</code>, it sets the number of edges used to form the\ncone&apos;s base. Using more edges makes the base look more like a circle. By\ndefault, <code>detailX</code> is 24.</p>\n<p>The fourth parameter, <code>detailY</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>cone(20, 30, 5, 7)</code>, it sets the number of triangle subdivisions to\nuse along the y-axis connecting the base to the tip. All 3D shapes are made\nby connecting triangles to form their surfaces. By default, <code>detailY</code> is 1.</p>\n<p>The fifth parameter, <code>cap</code>, is also optional. If a <code>false</code> is passed, as\nin <code>cone(20, 30, 5, 7, false)</code> the cone’s base won’t be drawn. By default,\n<code>cap</code> is <code>true</code>.</p>\n<p>Note: <code>cone()</code> can only be used in WebGL mode.</p>\n"],"line":[0,1139],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"radius"],"description":[0,"radius of the cone&apos;s base. Defaults to 50."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"height"],"description":[0,"height of the cone. Defaults to the value of <code>radius</code>."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"detailX"],"description":[0,"number of edges used to draw the base. Defaults to 24."],"type":[0,"Integer"],"optional":[0,true]}],[0,{"name":[0,"detailY"],"description":[0,"number of triangle subdivisions along the y-axis. Defaults to 1."],"type":[0,"Integer"],"optional":[0,true]}],[0,{"name":[0,"cap"],"description":[0,"whether to draw the cone&apos;s base.  Defaults to <code>true</code>."],"type":[0,"Boolean"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cone on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cone.\n  cone();\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cone on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cone.\n  // Set its radius and height to 30.\n  cone(30);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cone on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cone.\n  // Set its radius to 30 and height to 50.\n  cone(30, 50);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cone on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cone.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 5.\n  cone(30, 50, 5);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white pyramid on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cone.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 5.\n  cone(30, 50, 5);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cone on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cone.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 24 and detailY to 2.\n  cone(30, 50, 24, 2);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cone on a gray background. Its base is missing.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cone.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 24 and detailY to 1.\n  // Don&apos;t draw its base.\n  cone(30, 50, 24, 1, false);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/cone"]}],"body":[0,"# cone"],"filePath":[0,"src/content/reference/en/p5/cone.mdx"],"digest":[0,"140592196ce68075"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/curveDetail"],"data":[0,{"title":[0,"curveDetail()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Sets the number of segments used to draw spline curves in WebGL mode.</p>\n<p>In WebGL mode, smooth shapes are drawn using many flat segments. Adding\nmore flat segments makes shapes appear smoother.</p>\n<p>The parameter, <code>detail</code>, is the density of segments to use while drawing a\nspline curve.</p>\n<p>Note: <code>curveDetail()</code> has no effect in 2D mode.</p>\n"],"line":[0,2619],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"resolution"],"description":[0,"number of segments to use. Default is 1/4"],"type":[0,"Number"]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"function setup() {\n  createCanvas(100, 100, WEBGL);\n\n  background(200);\n\n  // Set the curveDetail() to 0.5\n  curveDetail(0.5);\n\n  // Do not show all the vertices\n  splineProperty(&apos;ends&apos;, EXCLUDE)\n\n  // Draw a black spline curve.\n  noFill();\n  strokeWeight(1);\n  stroke(0);\n  spline(-45, -24, 0, 23, -26, 0, 23, 11, 0, -35, 15, 0);\n\n  // Draw red spline curves from the anchor points to the control points.\n  spline(255, 0, 0);\n  spline(-45, -24, 0, -45, -24, 0, 23, -26, 0, 23, 11, 0);\n  spline(23, -26, 0, 23, 11, 0, -35, 15, 0, -35, 15, 0);\n\n  // Draw the anchor points in black.\n  strokeWeight(5);\n  stroke(0);\n  point(23, -26);\n  point(23, 11);\n\n  // Draw the control points in red.\n  stroke(255, 0, 0);\n  point(-45, -24);\n  point(-35, 15);\n\n  describe(\n    &apos;A gray square with a jagged curve drawn in three segments. The curve is a sideways U shape with red segments on top and bottom, and a black segment on the right. The endpoints of all the segments are marked with dots.&apos;\n  );\n}"]]],"isConstructor":[0,false],"path":[0,"p5/curveDetail"]}],"body":[0,"# curveDetail"],"filePath":[0,"src/content/reference/en/p5/curveDetail.mdx"],"digest":[0,"3281c401477c12c9"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/cylinder"],"data":[0,{"title":[0,"cylinder()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Draws a cylinder.</p>\n<p>A cylinder is a 3D shape with triangular faces that connect a flat bottom\nto a flat top. Cylinders with few faces look like boxes. Cylinders with\nmany faces have smooth surfaces.</p>\n<p>The first parameter, <code>radius</code>, is optional. If a <code>Number</code> is passed, as in\n<code>cylinder(20)</code>, it sets the radius of the cylinder’s base. By default,\n<code>radius</code> is 50.</p>\n<p>The second parameter, <code>height</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>cylinder(20, 30)</code>, it sets the cylinder’s height. By default,\n<code>height</code> is set to the cylinder’s <code>radius</code>.</p>\n<p>The third parameter, <code>detailX</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>cylinder(20, 30, 5)</code>, it sets the number of edges used to form the\ncylinder&apos;s top and bottom. Using more edges makes the top and bottom look\nmore like circles. By default, <code>detailX</code> is 24.</p>\n<p>The fourth parameter, <code>detailY</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>cylinder(20, 30, 5, 2)</code>, it sets the number of triangle subdivisions\nto use along the y-axis, between cylinder&apos;s the top and bottom. All 3D\nshapes are made by connecting triangles to form their surfaces. By default,\n<code>detailY</code> is 1.</p>\n<p>The fifth parameter, <code>bottomCap</code>, is also optional. If a <code>false</code> is passed,\nas in <code>cylinder(20, 30, 5, 2, false)</code> the cylinder’s bottom won’t be drawn.\nBy default, <code>bottomCap</code> is <code>true</code>.</p>\n<p>The sixth parameter, <code>topCap</code>, is also optional. If a <code>false</code> is passed, as\nin <code>cylinder(20, 30, 5, 2, false, false)</code> the cylinder’s top won’t be\ndrawn. By default, <code>topCap</code> is <code>true</code>.</p>\n<p>Note: <code>cylinder()</code> can only be used in WebGL mode.</p>\n"],"line":[0,933],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"radius"],"description":[0,"radius of the cylinder. Defaults to 50."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"height"],"description":[0,"height of the cylinder. Defaults to the value of <code>radius</code>."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"detailX"],"description":[0,"number of edges along the top and bottom. Defaults to 24."],"type":[0,"Integer"],"optional":[0,true]}],[0,{"name":[0,"detailY"],"description":[0,"number of triangle subdivisions along the y-axis. Defaults to 1."],"type":[0,"Integer"],"optional":[0,true]}],[0,{"name":[0,"bottomCap"],"description":[0,"whether to draw the cylinder&apos;s bottom. Defaults to <code>true</code>."],"type":[0,"Boolean"],"optional":[0,true]}],[0,{"name":[0,"topCap"],"description":[0,"whether to draw the cylinder&apos;s top. Defaults to <code>true</code>."],"type":[0,"Boolean"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cylinder on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cylinder.\n  cylinder();\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cylinder on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cylinder.\n  // Set its radius and height to 30.\n  cylinder(30);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cylinder on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cylinder.\n  // Set its radius to 30 and height to 50.\n  cylinder(30, 50);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white box on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cylinder.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 5.\n  cylinder(30, 50, 5);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cylinder on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cylinder.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 24 and detailY to 2.\n  cylinder(30, 50, 24, 2);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cylinder on a gray background. Its top is missing.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cylinder.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 24 and detailY to 1.\n  // Don&apos;t draw its bottom.\n  cylinder(30, 50, 24, 1, false);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white cylinder on a gray background. Its top and bottom are missing.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the cylinder.\n  // Set its radius to 30 and height to 50.\n  // Set its detailX to 24 and detailY to 1.\n  // Don&apos;t draw its bottom or top.\n  cylinder(30, 50, 24, 1, false, false);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/cylinder"]}],"body":[0,"# cylinder"],"filePath":[0,"src/content/reference/en/p5/cylinder.mdx"],"digest":[0,"209e7b20ebbebbaa"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/ellipsoid"],"data":[0,{"title":[0,"ellipsoid()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Draws an ellipsoid.</p>\n<p>An ellipsoid is a 3D shape with triangular faces that connect to form a\nround surface. Ellipsoids with few faces look like crystals. Ellipsoids\nwith many faces have smooth surfaces and look like eggs. <code>ellipsoid()</code>\ndefines a shape by its radii. This is different from\n<a href=\"/reference/p5/ellipse/\">ellipse()</a> which uses diameters\n(width and height).</p>\n<p>The first parameter, <code>radiusX</code>, is optional. If a <code>Number</code> is passed, as in\n<code>ellipsoid(20)</code>, it sets the radius of the ellipsoid along the x-axis. By\ndefault, <code>radiusX</code> is 50.</p>\n<p>The second parameter, <code>radiusY</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>ellipsoid(20, 30)</code>, it sets the ellipsoid’s radius along the y-axis.\nBy default, <code>radiusY</code> is set to the ellipsoid’s <code>radiusX</code>.</p>\n<p>The third parameter, <code>radiusZ</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>ellipsoid(20, 30, 40)</code>, it sets the ellipsoid’s radius along the\nz-axis. By default, <code>radiusZ</code> is set to the ellipsoid’s <code>radiusY</code>.</p>\n<p>The fourth parameter, <code>detailX</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>ellipsoid(20, 30, 40, 5)</code>, it sets the number of triangle\nsubdivisions to use along the x-axis. All 3D shapes are made by connecting\ntriangles to form their surfaces. By default, <code>detailX</code> is 24.</p>\n<p>The fifth parameter, <code>detailY</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>ellipsoid(20, 30, 40, 5, 7)</code>, it sets the number of triangle\nsubdivisions to use along the y-axis. All 3D shapes are made by connecting\ntriangles to form their surfaces. By default, <code>detailY</code> is 16.</p>\n<p>Note: <code>ellipsoid()</code> can only be used in WebGL mode.</p>\n"],"line":[0,1306],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"radiusX"],"description":[0,"radius of the ellipsoid along the x-axis. Defaults to 50."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"radiusY"],"description":[0,"radius of the ellipsoid along the y-axis. Defaults to <code>radiusX</code>."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"radiusZ"],"description":[0,"radius of the ellipsoid along the z-axis. Defaults to <code>radiusY</code>."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"detailX"],"description":[0,"number of triangle subdivisions along the x-axis. Defaults to 24."],"type":[0,"Integer"],"optional":[0,true]}],[0,{"name":[0,"detailY"],"description":[0,"number of triangle subdivisions along the y-axis. Defaults to 16."],"type":[0,"Integer"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white sphere on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the ellipsoid.\n  // Set its radiusX to 30.\n  ellipsoid(30);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white ellipsoid on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the ellipsoid.\n  // Set its radiusX to 30.\n  // Set its radiusY to 40.\n  ellipsoid(30, 40);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white ellipsoid on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the ellipsoid.\n  // Set its radiusX to 30.\n  // Set its radiusY to 40.\n  // Set its radiusZ to 50.\n  ellipsoid(30, 40, 50);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white ellipsoid on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the ellipsoid.\n  // Set its radiusX to 30.\n  // Set its radiusY to 40.\n  // Set its radiusZ to 50.\n  // Set its detailX to 4.\n  ellipsoid(30, 40, 50, 4);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white ellipsoid on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the ellipsoid.\n  // Set its radiusX to 30.\n  // Set its radiusY to 40.\n  // Set its radiusZ to 50.\n  // Set its detailX to 4.\n  // Set its detailY to 3.\n  ellipsoid(30, 40, 50, 4, 3);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/ellipsoid"]}],"body":[0,"# ellipsoid"],"filePath":[0,"src/content/reference/en/p5/ellipsoid.mdx"],"digest":[0,"68bf91f2b16fa16e"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/freeGeometry"],"data":[0,{"title":[0,"freeGeometry()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Clears a <a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a> object from the graphics\nprocessing unit (GPU) memory.</p>\n<p><a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a> objects can contain lots of data\nabout their vertices, surface normals, colors, and so on. Complex 3D shapes\ncan use lots of memory which is a limited resource in many GPUs. Calling\n<code>freeGeometry()</code> works with <a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a> objects\ncreated with <a href=\"/reference/p5/buildGeometry/\">buildGeometry()</a> and\n<a href=\"/reference/p5/loadModel/\">loadModel()</a>.</p>\n<p>The parameter, <code>geometry</code>, is the <a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a>\nobject to be freed.</p>\n<p>Note: A <a href=\"/reference/p5/p5.Geometry\">p5.Geometry</a> object can still be drawn\nafter its resources are cleared from GPU memory. It may take longer to draw\nthe first time it’s redrawn.</p>\n<p>Note: <code>freeGeometry()</code> can only be used in WebGL mode.</p>\n"],"line":[0,395],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"geometry"],"description":[0,"3D shape whose resources should be freed."],"type":[0,"p5.Geometry"]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nlet button;\nlet particles;\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  // Create a button to reset the particle system.\n  button = createButton(&apos;Reset&apos;);\n\n  // Call resetModel() when the user presses the button.\n  button.mousePressed(resetModel);\n\n  // Add the original set of particles.\n  resetModel();\n}\n\nfunction draw() {\n  background(50);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Turn on the lights.\n  lights();\n\n  // Style the particles.\n  noStroke();\n\n  // Draw the particles.\n  model(particles);\n}\n\nfunction resetModel() {\n  // If the p5.Geometry object has already been created,\n  // free those resources.\n  if (particles) {\n    freeGeometry(particles);\n  }\n\n  // Create a new p5.Geometry object with random spheres.\n  particles = buildGeometry(createParticles);\n}\n\nfunction createParticles() {\n  for (let i = 0; i < 60; i += 1) {\n    // Calculate random coordinates.\n    let x = randomGaussian(0, 20);\n    let y = randomGaussian(0, 20);\n    let z = randomGaussian(0, 20);\n\n    push();\n    // Translate to the particle&apos;s coordinates.\n    translate(x, y, z);\n    // Draw the particle.\n    sphere(5);\n    pop();\n  }\n}"]]],"isConstructor":[0,false],"path":[0,"p5/freeGeometry"]}],"body":[0,"# freeGeometry"],"filePath":[0,"src/content/reference/en/p5/freeGeometry.mdx"],"digest":[0,"bafe8dabf35a0e79"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/instances"],"data":[0,{"title":[0,"instances()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Draws <code>count</code> instances of the next 3D primitive or model using WebGL\ninstanced rendering.</p>\n<p>Call a draw method on the returned object to render that primitive\n<code>count</code> times in a single draw call. Instance-specific transforms and\nattributes (position, color, etc.) are supplied through a custom shader\nthat reads per-instance data from an instanced attribute buffer.</p>\n"],"line":[0,2699],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"count"],"description":[0,"number of instances\nto draw, or a storage buffer/list whose element count is used. A plain\nnumber must be a positive integer."],"type":[0,"Number|p5.StorageBuffer|p5.StorageList"]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"return":[0,{"description":[0,"an object with methods <code>sphere</code>, <code>box</code>, <code>plane</code>,\n<code>ellipsoid</code>, <code>cylinder</code>, <code>cone</code>, <code>torus</code>, <code>triangle</code>, <code>rect</code>, <code>quad</code>,\n<code>ellipse</code>, <code>arc</code>, <code>model</code>, <code>line</code>, <code>point</code>, <code>bezier</code>, and <code>spline</code>. Call one of\nthese to draw <code>count</code> instances of that primitive."],"type":[0,"p5.InstancesWrapper"]}],"example":[1,[[0,"<div>\n<code>\nlet myShader;\nlet count = 5;\n\nfunction setup() {\n  createCanvas(200, 200, WEBGL);\n  myShader = buildMaterialShader(drawSpaced);\n  describe(&apos;Five red spheres arranged in a horizontal line.&apos;);\n}\n\nfunction drawSpaced() {\n  worldInputs.begin();\n  // Spread spheres evenly across the canvas based on their index\n  let spacing = width / count;\n  worldInputs.position.x +=\n    (instanceIndex - (count - 1) / 2) * spacing;\n  worldInputs.end();\n}\n\nfunction draw() {\n  background(220);\n  lights();\n  noStroke();\n  fill(&apos;red&apos;);\n  shader(myShader);\n  instances(count).sphere(15);\n}\n</code>\n</div>"]]],"isConstructor":[0,false],"path":[0,"p5/instances"]}],"body":[0,"# instances"],"filePath":[0,"src/content/reference/en/p5/instances.mdx"],"digest":[0,"838956f68d15ab68"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/plane"],"data":[0,{"title":[0,"plane()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/3d_primitives.js"],"description":[0,"<p>Draws a plane.</p>\n<p>A plane is a four-sided, flat shape with every angle measuring 90˚. It’s\nsimilar to a rectangle and offers advanced drawing features in WebGL mode.</p>\n<p>The first parameter, <code>width</code>, is optional. If a <code>Number</code> is passed, as in\n<code>plane(20)</code>, it sets the plane’s width and height. By default, <code>width</code> is\n50.</p>\n<p>The second parameter, <code>height</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>plane(20, 30)</code>, it sets the plane’s height. By default, <code>height</code> is\nset to the plane’s <code>width</code>.</p>\n<p>The third parameter, <code>detailX</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>plane(20, 30, 5)</code> it sets the number of triangle subdivisions to use\nalong the x-axis. All 3D shapes are made by connecting triangles to form\ntheir surfaces. By default, <code>detailX</code> is 1.</p>\n<p>The fourth parameter, <code>detailY</code>, is also optional. If a <code>Number</code> is passed,\nas in <code>plane(20, 30, 5, 7)</code> it sets the number of triangle subdivisions to\nuse along the y-axis. All 3D shapes are made by connecting triangles to\nform their surfaces. By default, <code>detailY</code> is 1.</p>\n<p>Note: <code>plane()</code> can only be used in WebGL mode.</p>\n"],"line":[0,491],"overloads":[1,[[0,{"params":[1,[[0,{"name":[0,"width"],"description":[0,"width of the plane."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"height"],"description":[0,"height of the plane."],"type":[0,"Number"],"optional":[0,true]}],[0,{"name":[0,"detailX"],"description":[0,"number of triangle subdivisions along the x-axis."],"type":[0,"Integer"],"optional":[0,true]}],[0,{"name":[0,"detailY"],"description":[0,"number of triangle subdivisions along the y-axis."],"type":[0,"Integer"],"optional":[0,true]}]]]}]]],"itemtype":[0,"method"],"class":[0,"p5"],"chainable":[0,false],"example":[1,[[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white plane on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the plane.\n  plane();\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white plane on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the plane.\n  // Set its width and height to 30.\n  plane(30);\n}"],[0,"// Click and drag the mouse to view the scene from different angles.\n\nfunction setup() {\n  createCanvas(100, 100, WEBGL);\n\n  describe(&apos;A white plane on a gray background.&apos;);\n}\n\nfunction draw() {\n  background(200);\n\n  // Enable orbiting with the mouse.\n  orbitControl();\n\n  // Draw the plane.\n  // Set its width to 30 and height to 50.\n  plane(30, 50);\n}"]]],"isConstructor":[0,false],"path":[0,"p5/plane"]}],"body":[0,"# plane"],"filePath":[0,"src/content/reference/en/p5/plane.mdx"],"digest":[0,"6c7332b84819b056"],"deferredRender":[0,true],"collection":[0,"reference"]}],[0,{"id":[0,"en/p5/saveObj"],"data":[0,{"title":[0,"saveObj()"],"module":[0,"Shape"],"submodule":[0,"3D Primitives"],"file":[0,"src/webgl/p5.Geometry.js"],"description":[0,"<p>The <code>saveObj()</code> function exports <code>p5.Geometry</code> objects as\n3D models in the Wavefront .obj file format.\nThis way, you can use the 3D shapes you create in p5.js in other software\nfor rendering, animation, 3D printing, or more.</p>\n<p>The exported .obj file will include the faces and vertices of the <code>p5.Geometry</code>,\nas well as its texture coordinates and normals, if it has them.</p>
